    "crates/audio/audio-modifiers",
    "crates/audio/lip-sync",
    "crates/audio/transcription",
    "crates/audio/tts",
    "crates/audio/tts-gtk",
    "crates/background",
    "crates/benchmarking",
    "crates/blender/blender-bridge",
    "crates/core",
    "crates/evaluation",
    "crates/export/export-core",
    "crates/export/export-gtk",
    "crates/export/export-qt",
    "crates/math/color",
