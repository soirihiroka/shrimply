    "crates/math/geometry",
    "crates/math/media",
    "crates/manim/manim-parser",
    "crates/manim/manim-ir",
    "crates/manim/manim-wgpu",
    "crates/manim/manim-cuda",
    "crates/manim/manim-metal",
    "crates/media-info",
    "crates/mcp",
    "crates/paint/paint-edit",
    "crates/paint/paint-geometry",
    "crates/paint/paint-interpolation",
    "crates/paint/paint-model",
    "crates/paint/paint-skia",
    "crates/paint/paint-topology",
    "crates/paint/perfect-freehand",
    "crates/preferences/preferences-core",
    "crates/preferences/preferences-gtk",
    "crates/preferences/preferences-qt",
    "crates/pdf",
    "crates/interpolation",
    "crates/project/project",
    "crates/project/project-core",
    "crates/project/kdenlive",
    "crates/project/otio",
    "crates/property-transfer",
    "crates/preview/preview-core",
    "crates/preview/preview-interaction-core",
    "crates/preview/preview-render-core",
    "crates/preview/preview-metal",
    "crates/preview/loading-screen",
    "crates/preview/preview-skia",
    "crates/preview/playback-performance",
    "crates/preview/preview-gtk",
    "crates/preview/preview-qt",
    "crates/preview/preview-runtime",
    "crates/layered-image/layered-image",
    "crates/layered-image/kra-parser",
    "crates/layered-image/psd-parser",
    "crates/render-core",
    "crates/render-cuda",
    "crates/render-metal",
    "crates/resource-pipeline",
    "crates/server-client",
    "crates/slang-build",
    "crates/stabilization/affine-l1-stabilization",
    "crates/stabilization/mesh-flow-stabilization",
    "crates/stabilization/nvidia-optical-flow",
    "crates/state",
    "crates/support",
    "crates/timeline/timeline",
    "crates/timeline/timeline-core",
    "crates/timeline/timeline-gtk",
    "crates/timeline/timeline-qt",
    "crates/timeline/timeline-snap",
    "crates/timeline/timeline-value",
    "crates/timeline/keyframe-graph-core",
    "crates/timeline/discrete-keyframe-graph-core",
    "crates/ui/inspector-core",
    "crates/ui/inspector-gtk",
    "crates/ui/inspector-qt",
    "crates/ui/component-core",
    "crates/ui/components-demo-core",
    "crates/ui/cross-ui-core",
    "crates/ui/cross-ui-theme",
    "crates/ui/i18n-core",
    "crates/ui/i18n-gtk",
    "crates/ui/i18n-qt",
    "crates/ui/qt-helpers",
    "crates/ui/qt-components",
    "crates/ui/qt-components-demo",
    "crates/ui/skia-adw-core",
    "crates/ui/skia-metal",
    "crates/ui/skia-gl",
    "crates/ui/gtk-components",
    "crates/ui/gtk-components-demo",
    "crates/ui/wayland-pointer-lock",
    "crates/video/video-cuda",
    "crates/video/video-core",
    "crates/video/video-modifiers",
    "crates/video/video-recording",
    "crates/video/video-generation",
    "crates/video/video-generation-gtk",
    "crates/video/anime4k",
    "crates/video/decoder",
    "crates/video/decoder-pool",
    "crates/video/gpu-memory",
    "crates/video/visual-frame",
    "vendor/pocketsphinx",
    "vendor/rhubarb-lip-sync",
    "crates/3d/3d-control",
    "crates/3d/3dgs",
    "crates/3d/optix-denoiser",
    "crates/3d/render-3d",
    "crates/3d/scene-3d",
    "crates/3d/scene-3d-modifiers",
    "crates/3d/shape-3d",
    "crates/3d/text-3d",
    "crates/3d/transform-3d",
]
default-members = ["crates/apps/editor-gtk", "crates/apps/launcher-gtk"]
exclude = ["external/vtracer"]

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
base64 = "0.22"
ash = "0.38"
async-channel = "2"
autodiff = "0.7"
blend = "0.9"
cached = { version = "3", default-features = false, features = ["ahash"] }
cairo = { package = "cairo-rs", version = "0.22" }
cint = "0.3"
cpal = "0.18"
cxx = "1"
cxx-qt = "0.9.1"
cxx-qt-build = "0.9.1"
cxx-qt-lib = "0.9.1"
shrimply-cuda = { path = "crates/cuda/bridge" }
shrimply-pocketsphinx = { path = "vendor/pocketsphinx" }
shrimply-rhubarb-lip-sync = { path = "vendor/rhubarb-lip-sync" }
cc = "1"
deep_filter = { path = "vendor/deepfilternet/libDF" }
easyfft = "0.4"
ffmpeg-next = "9"
fraction = "0.17"
fundsp = { version = "0.23", default-features = false }
good_lp = { version = "1", default-features = false, features = ["highs"] }
glam = "0.33"
gltf = { version = "1", features = ["KHR_texture_transform"] }
glib = "0.22"
gio = "0.22"
gdk = { package = "gdk4", version = "0.11", features = ["v4_22"] }
gdk-pixbuf = "0.22"
glow = "0.18"
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
half = "2"
hashbrown = { version = "0.17", features = ["serde"] }
icu_locale = "2.3"
imagesize = "0.15"
kamadak-exif = "0.6"
libc = "0.2"
lyon_tessellation = "1"
lofty = "0.25"
lzf = "1"
moxcms = "0.9"
nalgebra = "0.35"
ndarray = "0.17"
nnnoiseless = "0.5"
notify = "8"
num-traits = "0.2"
objc2 = "0.6.2"
block2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3.2"
oklab = "1"
opencv = { version = "0.100", default-features = false, features = ["calib3d", "clang-runtime", "imgproc", "video", "videoio"] }
pango = "0.22"
pangocairo = "0.22"
pest = "2.9"
pest_derive = "2.9"
pipewire = { version = "0.10", features = ["v0_3_44"] }
png = "0.18"
poppler = { package = "poppler-rs", version = "0.26", features = ["v0_82"] }
psd = "0.3"
quick-xml = "0.42"
rangemap = "1"
rayon = "1"
reqwest = "0.13"
rmcp = { version = "3.1", default-features = false, features = ["macros", "server", "transport-io"] }
rhai = "1"
rmp-serde = "1"
rust-i18n = "4"
rusqlite = "0.40"
serde = "1"
serde_bytes = "0.11"
serde_json = "1"
serde-value = "0.7"
schemars = "1"
skia-safe = "0.99"
sourceview5 = "0.11"
tempfile = "3"
tracing = "0.1"
strum = "0.28"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
typos = "0.10"
typos-dict = "0.14"
unicase = "2"
unicode-segmentation = "1"
uuid = "1"
vtracer = { path = "external/vtracer/crates/vtracer" }
wayland-client = "0.31"
wayland-protocols = "0.32"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
lto = "off"

[profile.dev.package."*"]
debug = 0

[profile.dev.package.shrimply-editor-gtk]
opt-level = 0

[profile.dev.package.shrimply-launcher-gtk]
opt-level = 0
