[package]
name = "deep_filter"
version = "0.5.7-pre"
authors = ["Hendrik Schröter"]
edition = "2021"
description = "DeepFilterNet Rust inference core vendored for Shrimply"
repository = "https://github.com/Rikorose/DeepFilterNet"
license = "MIT OR Apache-2.0"
readme = "../README.md"
rust-version = "1.96"

[lib]
name = "df"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
itertools.workspace = true
log.workspace = true
ndarray.workspace = true
num-complex = { workspace = true, features = ["serde"] }
realfft.workspace = true
rust-ini.workspace = true
rustfft.workspace = true
tar.workspace = true
tract-core.workspace = true
tract-onnx.workspace = true
tract-pulse.workspace = true
