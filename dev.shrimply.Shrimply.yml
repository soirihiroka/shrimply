app-id: dev.shrimply.Shrimply
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: shrimply

build-options:
  no-debuginfo: true

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=session-bus
  - --socket=system-bus
  - --talk-name=org.freedesktop.Flatpak
  - --device=all
  - --filesystem=host
  - --filesystem=/run/media
  - --filesystem=xdg-run/pipewire-0
  - --env=CUDA_MODULE_LOADING=EAGER

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - "*.a"
  - "*.la"

modules:
  - name: spirv-tools
    buildsystem: cmake-ninja
    config-opts:
      - -DSPIRV_SKIP_TESTS=ON
      - -DSPIRV_WERROR=OFF
    cleanup:
      - "*"
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: v2026.4
        commit: ef96ed763b43b59b33b31b362f09a02b729fa1c9
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        commit: 496543121ce6419f23d6fa5d7194ba66c36212d2
        dest: external/spirv-headers

  - name: level-zero
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/oneapi-src/level-zero.git
        tag: v1.35.0
        commit: 9e1a8b2c07ed6ce1f00b0a195fa5efa0db8e3650

  - name: open-image-denoise
    buildsystem: simple
    build-commands:
      - install -d /app/lib /app/share/licenses/oidn
      - cp -a lib/*.so* /app/lib/
      - rm -f /app/lib/*device_cpu* /app/lib/*device_hip* /app/lib/libtbb*
      - cp -a doc/LICENSE* doc/third-party-programs*.txt /app/share/licenses/oidn/
    sources:
      - type: archive
        url: https://github.com/RenderKit/oidn/releases/download/v2.5.1/oidn-2.5.1.x86_64.linux.tar.gz
        sha256: 743c3e2aff8c220d5d70fe6cb970fb3d36f2702d2693c61d1d148e404cf37cd6

  - name: rubberband
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Ddefault_library=shared
      - -Dfft=builtin
      - -Dresampler=builtin
      - -Djni=disabled
      - -Dladspa=disabled
      - -Dlv2=disabled
      - -Dvamp=disabled
      - -Dcmdline=disabled
      - -Dtests=disabled
    sources:
      - type: git
        url: https://github.com/breakfastquay/rubberband.git
        tag: v4.0.0
        commit: 1d95888bec3ae0a17c0c4af791810d5a63f6bc35

  - name: fdk-aac
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROGRAMS=OFF
    sources:
      - type: archive
        url: https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v2.0.3.tar.gz
        sha256: e25671cd96b10bad896aa42ab91a695a9e573395262baed4e4a2ff178d6a3a78

  - name: nv-codec-headers
    buildsystem: simple
    build-commands:
      - make PREFIX=/app install
    sources:
      - type: archive
        url: https://github.com/FFmpeg/nv-codec-headers/archive/refs/tags/n12.2.72.0.tar.gz
        sha256: dbeaec433d93b850714760282f1d0992b1254fc3b5a6cb7d76fc1340a1e47563

  - name: x264
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --enable-pic --disable-cli --disable-opencl
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/x264/-/archive/b35605ace3ddf7c1a5d67a2eb553f034aef41d55/x264-b35605ace3ddf7c1a5d67a2eb553f034aef41d55.tar.gz
        sha256: cd71a7515b0e9a012e1ac9b1f8415bebcaf6fc97d4db32286642ac4c0fbe24f9

  - name: x265
    buildsystem: cmake-ninja
    subdir: source
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_CLI=OFF
      - -DENABLE_LIBNUMA=OFF
    sources:
      - type: archive
        url: https://codeload.github.com/Multicorewareinc/x265/tar.gz/refs/tags/4.3
        archive-type: tar-gzip
        sha256: fb157f809b74dabbef5002af99489fcaebb4d0073724beffdaaf2be15cbaf7ac

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --disable-ffplay
      - --enable-libfdk-aac
      - --enable-nonfree
      - --enable-libopus
      - --enable-gpl
      - --enable-libx264
      - --enable-libx265
      - --enable-ffnvcodec
      - --enable-vulkan
      - --enable-vaapi
      - --enable-libdrm
      - --enable-gnutls
    sources:
      - type: archive
        path: '@SHRIMPLY_FFMPEG@'
        strip-components: 0
      - type: shell
        commands:
          - cp RELEASE FF_VERSION

  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_GLIB=ON
      - -DENABLE_BOOST=OFF
      - -DENABLE_UTILS=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.08.0.tar.xz
        sha256: dc906e68cea698109706ac6aa3d2c9d4512fcfcac42d90b8afcda486d1b9abd0

  - name: shrimply-gtk
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
        - --filesystem=host-os:ro
      env:
        RUSTUP_HOME: /run/host/usr/local/rustup
        CARGO_HOME: /run/ccache/cargo-home
        CARGO_TARGET_DIR: /run/ccache/cargo-target
        CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
        SHRIMPLY_BUILD_GIT_HASH: '@SHRIMPLY_GIT_HASH@'
        SHRIMPLY_FFMPEG_PREFIX: /app
        # Link the bundled FFmpeg before the SDK's incompatible version.
        RUSTFLAGS: "-L native=/app/lib -C link-arg=-fuse-ld=lld"
        PATH: /run/host/usr/local/cargo/bin:/run/host/usr/local/cuda-12.9/bin:/usr/lib/sdk/llvm22/bin:/app/bin:/usr/bin
        CUDA_HOME: /run/host/usr/local/cuda-12.9
        CUDA_TOOLKIT_PATH: /run/host/usr/local/cuda-12.9
        CUDA_IMAGE_FORMAT: ptx
        CUDA_PTX_TARGET: compute_50
        CUDA_HOST_CXX: /run/build/shrimply-gtk/packaging/flatpak/nvcc-g++
        CUDA_ALLOW_UNSUPPORTED_COMPILER: "1"
        CLANG_PATH: /run/host/usr/bin/clang
        LIBCLANG_PATH: /run/host/usr/lib/llvm-18/lib
        LIBRARY_PATH: /run/host/usr/local/cuda-12.9/lib64/stubs
    build-commands:
      - >-
        make release
        RUSTUP=/run/host/usr/local/cargo/bin/rustup
        CUDA_PTX_TARGET="${CUDA_PTX_TARGET}"
      - >-
        make install PREFIX=/app
        RUSTUP=/run/host/usr/local/cargo/bin/rustup
        CUDA_PTX_TARGET="${CUDA_PTX_TARGET}"
      # Compile Python extensions against the SDK, never on the user's machine.
      - >-
        UV_PROJECT_ENVIRONMENT=/app/share/shrimply/crates/media/visual/manim/manim-bridge/python/.venv
        build-tools/uv/uv sync --frozen --no-dev --no-editable
        --python /usr/bin/python3.14
        --project /app/share/shrimply/crates/media/visual/manim/manim-bridge/python
      - >-
        /app/share/shrimply/crates/media/visual/manim/manim-bridge/python/.venv/bin/python
        -c 'import av, manimpango, manimlib, msgpack'
      - test ! -e /app/bin/uv
      - test ! -e /app/libexec/shrimply/qt/shrimply
      - test ! -e /app/libexec/shrimply/qt/shrimply-editor
      - test ! -e /app/share/applications/dev.shrimply.Shrimply.Qt.desktop
    sources:
      - type: archive
        path: '@SHRIMPLY_SOURCE@'
        strip-components: 0
      - type: archive
        url: https://github.com/astral-sh/uv/releases/download/0.12.5/uv-x86_64-unknown-linux-musl.tar.gz
        sha256: a4742988791c9aeae68c78150d6cba762062ad2a47e53738c2779d2b596bfcdb
        dest: build-tools/uv
