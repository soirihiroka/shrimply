name: Flatpak prerelease

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flatpak.yml"
      - ".github/actions/cache-cargo/**"
      - ".github/actions/setup-flatpak/**"
      - ".github/scripts/**"
      - "packaging/flatpak/**"
      - "packaging/linux/**"
      - "dev.shrimply.Shrimply.yml"
      - ".cargo/**"
      - ".gitmodules"
      - "assets/**"
      - "crates/**"
      - "sanim/crates/**"
      - "sanim/Cargo.toml"
      - "sanim/Cargo.lock"
      - "external/**"
      - "vendor/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "rust-toolchain.toml"
      - "!**/*.md"
      - "!**/*.rst"
      - "!**/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-prerelease-${{ github.ref }}

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  FLATPAK_BUNDLE: dist/shrimply-gtk-x86_64.flatpak
  FLATPAK_REPO_DIR: target/flatpak-gtk/repo
  FLATPAK_PAGES_DIR: target/flatpak-pages
  FLATPAK_PAGES_URL: https://soirihiroka.github.io/shrimply

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/setup-flatpak
        id: setup

      - name: Build Flatpak
        run: |
          mkdir -p \
            "${FLATPAK_BUILD_DIR}" \
            "${FLATPAK_REPO_DIR}" \
            "${FLATPAK_STATE_DIR}" \
            "$(dirname "${FLATPAK_BUNDLE}")"
          git config --global --add safe.directory '*'
          flatpak-builder \
            --user \
            --ccache \
            --disable-rofiles-fuse \
            --force-clean \
            --state-dir="${FLATPAK_STATE_DIR}" \
            --repo="${FLATPAK_REPO_DIR}" \
            --install-deps-from=flathub \
            "${FLATPAK_BUILD_DIR}" \
            "${{ steps.setup.outputs.manifest }}"
          df -h /

      - name: Save Flatpak application cache
        id: save-application-cache
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.setup.outputs.application-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FLATPAK_STATE_DIR }}/ccache/cargo-target
          key: ${{ steps.setup.outputs.application-key }}

      - name: Prune old Flatpak application caches
        if: github.ref == 'refs/heads/main' && steps.save-application-cache.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.setup.outputs.application-key }}
        run: |
          bash .github/scripts/prune-application-caches.sh "${CACHE_KEY}" \
            "flatpak-application-v2-ubuntu-24.04-${{ runner.arch }}-" \
            "flatpak-application-ubuntu-24.04-${{ runner.arch }}-"

      - name: Prepare signed repository and bundle
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: bash packaging/flatpak/prepare-repository.sh

      - name: Prepare release identity
        id: release
        run: |
          commit="$(ostree --repo="${FLATPAK_REPO_DIR}" rev-parse app/dev.shrimply.Shrimply/x86_64/master)"
          {
            echo "tag=flatpak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "commit=${commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify Flatpak bundle
        run: |
          verify_repo="${RUNNER_TEMP}/flatpak-verify"
          ostree init --repo="${verify_repo}" --mode=archive-z2
          flatpak build-import-bundle "${verify_repo}" "${FLATPAK_BUNDLE}"
          test "$(ostree --repo="${verify_repo}" rev-parse app/dev.shrimply.Shrimply/x86_64/master)" = "${{ steps.release.outputs.commit }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.tag }}
          path: ${{ env.FLATPAK_BUNDLE }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages repository
        uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ steps.release.outputs.tag }}
          path: ${{ env.FLATPAK_PAGES_DIR }}
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.tag }}
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages repository
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ needs.build.outputs.tag }}

      - name: Verify published remote
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if grep -q 'dl.google.com/linux/chrome' "${source}"; then
              sudo mv "${source}" "${source}.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak
          export FLATPAK_USER_DIR="${RUNNER_TEMP}/flatpak-user"
          descriptor="${RUNNER_TEMP}/shrimply-prerelease.flatpakrepo"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "${FLATPAK_PAGES_URL}/shrimply-prerelease.flatpakrepo" --output "${descriptor}"
          flatpak remote-add --user shrimply-prerelease "${descriptor}"
          actual_commit="$(flatpak remote-info --user --show-commit shrimply-prerelease dev.shrimply.Shrimply/x86_64/master)"
          test "${actual_commit}" = "${EXPECTED_COMMIT}"

      - name: Publish prerelease
        run: |
          bash .github/scripts/publish-prerelease.sh \
            "${FLATPAK_BUNDLE}"
