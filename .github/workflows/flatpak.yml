name: Flatpak prerelease

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-prerelease
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TZ: UTC
  CARGO_HOME: /usr/local/cargo
  CUDA_KEYRING_SHA256: d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba
  CUDA_SERIES: 12-9
  CUDA_VERSION: "12.9"
  FLATPAK_BUILD_DIR: target/flatpak-gtk/build
  FLATPAK_BUNDLE: dist/shrimply-gtk.flatpak
  FLATPAK_REPO_DIR: target/flatpak-gtk/repo
  FLATPAK_STATE_DIR: target/flatpak-gtk/state
  FLATPAK_PAGES_DIR: target/flatpak-pages
  FLATPAK_PAGES_URL: https://soirihiroka.github.io/shrimply
  GNOME_RUNTIME_VERSION: "50"
  RUSTUP_HOME: /usr/local/rustup

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      timestamp: ${{ steps.release.outputs.timestamp }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install host build dependencies
        run: |
          # Chrome is preinstalled on the runner but is not a build dependency.
          for source in /etc/apt/sources.list.d/*; do
            if grep -q 'dl.google.com/linux/chrome' "${source}"; then
              sudo mv "${source}" "${source}.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            clang \
            curl \
            flatpak \
            flatpak-builder \
            g++ \
            git \
            gnupg \
            ostree \
            libclang-dev \
            librsvg2-common \
            make \
            pkg-config

          cuda_keyring="${RUNNER_TEMP}/cuda-keyring.deb"
          curl --fail --location --silent --show-error \
            "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb" \
            --output "${cuda_keyring}"
          echo "${CUDA_KEYRING_SHA256}  ${cuda_keyring}" | sha256sum --check --strict
          sudo dpkg --install "${cuda_keyring}"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "cuda-nvcc-${CUDA_SERIES}"
          sudo apt-get clean

          sudo install -d -o "${USER}" -g "$(id -gn)" "${RUSTUP_HOME}" "${CARGO_HOME}"
          sudo install -d /usr/local/libclang-deps
          for library in \
            libbsd.so.0 \
            libedit.so.2 \
            libffi.so.8 \
            libicudata.so.74 \
            libicuuc.so.74 \
            liblzma.so.5 \
            libmd.so.0 \
            libtinfo.so.6 \
            libxml2.so.2 \
            libz.so.1 \
            libzstd.so.1
          do
            sudo ln -sf "/run/host/usr/lib/x86_64-linux-gnu/${library}" "/usr/local/libclang-deps/${library}"
          done

          test -x "/usr/local/cuda-${CUDA_VERSION}/bin/nvcc"
          test -f "/usr/local/cuda-${CUDA_VERSION}/include/cuda.h"
          test -f "/usr/local/cuda-${CUDA_VERSION}/lib64/stubs/libcuda.so"

      - name: Restore Rust toolchain
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /usr/local/cargo
            /usr/local/rustup
          key: rust-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Rust toolchain
        run: |
          if [[ ! -x "${CARGO_HOME}/bin/rustup" ]]; then
            rustup_init="${RUNNER_TEMP}/rustup-init"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              https://sh.rustup.rs \
              --output "${rustup_init}"
            chmod +x "${rustup_init}"
            "${rustup_init}" --yes --default-toolchain none --profile minimal
          fi
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/rustup" show

      - name: Save Rust toolchain
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /usr/local/cargo
            /usr/local/rustup
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Install GNOME SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes --noninteractive flathub \
            "org.gnome.Sdk//${GNOME_RUNTIME_VERSION}"

      # Both builds must use the same manifest path: --state-dir keys the cache by it.
      - name: Create Flatpak source archive
        id: source
        shell: bash
        run: |
          source_archive="${RUNNER_TEMP}/shrimply-source.tar"
          git ls-files --recurse-submodules -z \
            | tar \
              --exclude-from=.dockerignore \
              --group=0 \
              --no-recursion \
              --null \
              --numeric-owner \
              --owner=0 \
              -cf "${source_archive}" \
              -T -
          source_hash="$(sha256sum "${source_archive}" | cut -d ' ' -f 1)"
          hashed_archive="${RUNNER_TEMP}/shrimply-source-${source_hash}.tar"
          mv "${source_archive}" "${hashed_archive}"

          manifest="${RUNNER_TEMP}/dev.shrimply.Shrimply.yml"
          cp dev.shrimply.Shrimply.yml "${manifest}"
          grep -q '@SHRIMPLY_SOURCE@' "${manifest}"
          sed -i "s|@SHRIMPLY_SOURCE@|${hashed_archive}|" "${manifest}"
          if grep -q '@SHRIMPLY_SOURCE@' "${manifest}"; then
            echo "Flatpak source placeholder was not replaced" >&2
            exit 1
          fi
          echo "manifest=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Resolve dependency cache key
        id: dependency-cache-key
        run: |
          sed '/^  - name: shrimply-gtk$/,$d' dev.shrimply.Shrimply.yml \
            | sha256sum \
            | cut -d ' ' -f 1 \
            | sed 's/^/hash=/' >> "${GITHUB_OUTPUT}"

      - name: Restore Flatpak dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FLATPAK_STATE_DIR }}
          key: flatpak-dependencies-v2-ubuntu-24.04-${{ runner.arch }}-cuda-${{ env.CUDA_VERSION }}-${{ steps.dependency-cache-key.outputs.hash }}
          restore-keys: |
            flatpak-dependencies-v2-ubuntu-24.04-${{ runner.arch }}-cuda-${{ env.CUDA_VERSION }}-

      - name: Prepare Flatpak dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${FLATPAK_BUILD_DIR}" "${FLATPAK_STATE_DIR}"
          flatpak-builder \
            --user \
            --ccache \
            --disable-rofiles-fuse \
            --force-clean \
            --state-dir="${FLATPAK_STATE_DIR}" \
            --install-deps-from=flathub \
            --stop-at=shrimply-gtk \
            "${FLATPAK_BUILD_DIR}" \
            "${{ steps.source.outputs.manifest }}"

      - name: Save Flatpak dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FLATPAK_STATE_DIR }}
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Resolve application cache key
        id: application-cache-key
        run: |
          sdk_commit="$(flatpak info --user --show-commit "org.gnome.Sdk//${GNOME_RUNTIME_VERSION}")"
          native_versions="$(dpkg-query -W)"
          native_hash="$(printf '%s\n' "${ImageOS}" "${ImageVersion}" "${sdk_commit}" "${native_versions}" \
            | LC_ALL=C sort | sha256sum | cut -d ' ' -f 1)"
          echo "prefix=flatpak-application-v2-ubuntu-24.04-${{ runner.arch }}-cuda-${CUDA_VERSION}-${{ hashFiles('rust-toolchain.toml') }}-${native_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore Flatpak application cache
        id: application-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.FLATPAK_STATE_DIR }}/ccache/cargo-home
            ${{ env.FLATPAK_STATE_DIR }}/ccache/cargo-target
          key: ${{ steps.application-cache-key.outputs.prefix }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'external/**/Cargo.toml', '.cargo/config.toml', 'Makefile', 'dev.shrimply.Shrimply.yml', 'packaging/flatpak/nvcc-g++', '.github/workflows/flatpak.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.application-cache-key.outputs.prefix }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'external/**/Cargo.toml', '.cargo/config.toml', 'Makefile', 'dev.shrimply.Shrimply.yml', 'packaging/flatpak/nvcc-g++', '.github/workflows/flatpak.yml') }}-
            ${{ steps.application-cache-key.outputs.prefix }}-

      - name: Build Flatpak
        run: |
          mkdir -p \
            "${FLATPAK_BUILD_DIR}" \
            "${FLATPAK_REPO_DIR}" \
            "${FLATPAK_STATE_DIR}" \
            "$(dirname "${FLATPAK_BUNDLE}")"
          git config --global --add safe.directory '*'
          flatpak-builder \
            --user \
            --ccache \
            --disable-rofiles-fuse \
            --force-clean \
            --state-dir="${FLATPAK_STATE_DIR}" \
            --repo="${FLATPAK_REPO_DIR}" \
            --install-deps-from=flathub \
            "${FLATPAK_BUILD_DIR}" \
            "${{ steps.source.outputs.manifest }}"
          df -h /

      - name: Save Flatpak application cache
        id: save-application-cache
        if: ${{ success() && steps.application-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.FLATPAK_STATE_DIR }}/ccache/cargo-home
            ${{ env.FLATPAK_STATE_DIR }}/ccache/cargo-target
          key: ${{ steps.application-cache.outputs.cache-primary-key }}

      - name: Prune old Flatpak application caches
        if: steps.save-application-cache.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.application-cache.outputs.cache-primary-key }}
        run: |
          bash .github/scripts/prune-application-caches.sh "${CACHE_KEY}" \
            "flatpak-application-v2-ubuntu-24.04-${{ runner.arch }}-" \
            "flatpak-application-ubuntu-24.04-${{ runner.arch }}-"

      - name: Prepare signed repository and bundle
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: bash packaging/flatpak/prepare-repository.sh

      - name: Prepare release identity
        id: release
        run: |
          commit="$(ostree --repo="${FLATPAK_REPO_DIR}" rev-parse app/dev.shrimply.Shrimply/x86_64/master)"
          {
            echo "tag=flatpak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "commit=${commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify Flatpak bundle
        run: |
          verify_repo="${RUNNER_TEMP}/flatpak-verify"
          ostree init --repo="${verify_repo}" --mode=archive-z2
          flatpak build-import-bundle "${verify_repo}" "${FLATPAK_BUNDLE}"
          test "$(ostree --repo="${verify_repo}" rev-parse app/dev.shrimply.Shrimply/x86_64/master)" = "${{ steps.release.outputs.commit }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            ${{ env.FLATPAK_BUNDLE }}
            ${{ env.FLATPAK_BUNDLE }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages repository
        uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ steps.release.outputs.tag }}
          path: ${{ env.FLATPAK_PAGES_DIR }}
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_TIMESTAMP: ${{ needs.build.outputs.timestamp }}
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.tag }}
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages repository
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ needs.build.outputs.tag }}

      - name: Verify published remote
        run: |
          for source in /etc/apt/sources.list.d/*; do
            if grep -q 'dl.google.com/linux/chrome' "${source}"; then
              sudo mv "${source}" "${source}.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends flatpak
          export FLATPAK_USER_DIR="${RUNNER_TEMP}/flatpak-user"
          descriptor="${RUNNER_TEMP}/shrimply-prerelease.flatpakrepo"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            "${FLATPAK_PAGES_URL}/shrimply-prerelease.flatpakrepo" --output "${descriptor}"
          flatpak remote-add --user shrimply-prerelease "${descriptor}"
          actual_commit="$(flatpak remote-info --user --show-commit shrimply-prerelease dev.shrimply.Shrimply/x86_64/master)"
          test "${actual_commit}" = "${EXPECTED_COMMIT}"

      - name: Publish prerelease
        run: |
          (cd dist && sha256sum --check shrimply-gtk.flatpak.sha256)
          short_sha="${GITHUB_SHA:0:12}"
          release_notes="${RUNNER_TEMP}/flatpak-release.md"
          {
            echo "Pre-alpha GTK Flatpak build of commit [\`${short_sha}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "Built ${RELEASE_TIMESTAMP}. Updates track main."
            echo
            echo '```console'
            echo "flatpak install --user ${FLATPAK_PAGES_URL}/shrimply-prerelease.flatpakref"
            echo 'flatpak update --user dev.shrimply.Shrimply'
            echo '```'
            echo
            echo "Alternatively, install the attached bundle with \`flatpak install --user ./shrimply-gtk.flatpak\`; it also receives updates from the prerelease remote."
          } > "${release_notes}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            existing_assets="${RUNNER_TEMP}/existing-release"
            mkdir -p "${existing_assets}"
            gh release download "${RELEASE_TAG}" --dir "${existing_assets}" \
              --pattern shrimply-gtk.flatpak --pattern shrimply-gtk.flatpak.sha256
            cmp "${FLATPAK_BUNDLE}.sha256" "${existing_assets}/shrimply-gtk.flatpak.sha256"
            (cd "${existing_assets}" && sha256sum --check shrimply-gtk.flatpak.sha256)
          else
            gh release create "${RELEASE_TAG}" \
              "${FLATPAK_BUNDLE}#Shrimply GTK Flatpak" \
              "${FLATPAK_BUNDLE}.sha256#SHA-256 checksum" \
              --target "${GITHUB_SHA}" \
              --title "Shrimply Prerelease ${RELEASE_TIMESTAMP}" \
              --notes-file "${release_notes}" \
              --prerelease \
              --latest=false
          fi

          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("flatpak-"))) | .tagName' \
            | while IFS= read -r old_tag; do
                if [[ "${old_tag}" != "${RELEASE_TAG}" ]]; then
                  gh release delete "${old_tag}" --cleanup-tag --yes
                fi
              done
