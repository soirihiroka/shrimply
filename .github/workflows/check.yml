name: Verify packaged native remote editing

on:
  workflow_dispatch:
    inputs:
      macos-run:
        description: Build run with the signed macOS artifact
        required: true
        type: string
      windows-run:
        description: Build run with the Windows artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  TZ: UTC

jobs:
  remote:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            build: ${{ inputs.macos-run }}
            artifact: shrimply-macos-arm64
            executable: Shrimply.app/Contents/MacOS/shrimply
            server: target/debug/shrimply-project-server
          - runner: windows-2022
            build: ${{ inputs.windows-run }}
            artifact: shrimply-windows-x86_64
            executable: shrimply.exe
            server: target/debug/shrimply-project-server.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build the local project server
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          make project-server

      - name: Download the exact application package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ matrix.build }}
          PACKAGE_NAME: ${{ matrix.artifact }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          for attempt in {1..65}; do
            if gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --name "$PACKAGE_NAME"; then
              exit 0
            fi
            status=$(gh run view "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
            test "$status" != completed
            sleep 10
          done
          exit 1

      - name: Unpack and verify the macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          ditto -x -k shrimply-macos-arm64.zip .
          codesign --verify --deep --strict Shrimply.app

      - name: Unpack the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive "$env:RUNNER_TEMP/shrimply-windows-x86_64.zip" "$env:RUNNER_TEMP"

      - name: Verify two clients, remote playhead, and offline reconnect
        env:
          APP_ENTRY: ${{ matrix.executable }}
          SERVER_ENTRY: ${{ matrix.server }}
        shell: bash
        run: python packaging/packaged-remote-smoke.py "$RUNNER_TEMP/$APP_ENTRY" "$SERVER_ENTRY"

      - name: Open the packaged Windows launcher and capture its window
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'shrimply.exe'
          $capture = Join-Path $env:RUNNER_TEMP 'launcher-capture'
          New-Item -ItemType Directory $capture | Out-Null
          $fixture = Start-Process $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru `
            -ArgumentList @('project','create','--project','Layout.shrimp','--name','Layout-fixture') `
            -RedirectStandardOutput "$capture/fixture.json" -RedirectStandardError "$capture/fixture.log"
          if (!$fixture.WaitForExit(30000)) {
            $fixture.Kill()
            throw 'Timed out creating the launcher fixture'
          }
          if ($fixture.ExitCode -ne 0 -or !(Get-Content "$capture/fixture.json" -Raw | ConvertFrom-Json).result.created) {
            throw 'Could not create the launcher fixture'
          }
          $launcher = Start-Process $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru `
            -RedirectStandardOutput "$capture/launcher.stdout.log" -RedirectStandardError "$capture/launcher.stderr.log"
          try {
            for ($i = 0; $i -lt 80; $i++) {
              $launcher.Refresh()
              if ($launcher.HasExited) { throw "Launcher exited with $($launcher.ExitCode)" }
              if ($launcher.MainWindowTitle -eq 'Shrimply') { break }
              Start-Sleep -Milliseconds 250
            }
            if ($launcher.MainWindowTitle -ne 'Shrimply') { throw 'No Shrimply window appeared' }
            (New-Object -ComObject WScript.Shell).AppActivate($launcher.Id) | Out-Null
            Start-Sleep -Milliseconds 500
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName System.Drawing
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($launcher.MainWindowHandle)
            $rect = $window.Current.BoundingRectangle
            $bitmap = [System.Drawing.Bitmap]::new([int]$rect.Width,[int]$rect.Height)
            try {
              $canvas = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                $canvas.CopyFromScreen([int]$rect.X,[int]$rect.Y,0,0,$bitmap.Size)
                $bitmap.Save("$capture/launcher.png",[System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $canvas.Dispose() }
            } finally { $bitmap.Dispose() }
          } finally {
            if (!$launcher.HasExited) { $launcher.Kill(); $launcher.WaitForExit() }
          }

      - name: Upload the native launcher capture
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-launcher
          path: ${{ runner.temp }}/launcher-capture
