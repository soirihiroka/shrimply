name: Verify packaged native remote editing

on:
  workflow_dispatch:
    inputs:
      macos-run:
        description: Build run with the signed macOS artifact
        required: true
        type: string
      windows-run:
        description: Build run with the Windows artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  TZ: UTC

jobs:
  remote:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            build: ${{ inputs.macos-run }}
            artifact: shrimply-macos-arm64
            executable: Shrimply.app/Contents/MacOS/shrimply
            server: target/debug/shrimply-project-server
          - runner: windows-2022
            build: ${{ inputs.windows-run }}
            artifact: shrimply-windows-x86_64
            executable: shrimply.exe
            server: target/debug/shrimply-project-server.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build the local project server
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          make project-server

      - name: Build older and newer project-server releases for the version test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          server=target/debug/shrimply-project-server
          manifest=crates/integrations/project-server/Cargo.toml
          cp "$server" "$RUNNER_TEMP/server-current"
          for version in 0.0.99 0.1.1; do
            git restore -- "$manifest"
            sed -i '' "s/^version.workspace = true$/version = \"$version\"/" "$manifest"
            make project-server
            test "$("$server" --version)" = "shrimply-project-server $version"
            cp "$server" "$RUNNER_TEMP/server-$version"
          done
          git restore -- "$manifest" Cargo.lock

      - name: Download the exact application package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ matrix.build }}
          PACKAGE_NAME: ${{ matrix.artifact }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          for attempt in {1..65}; do
            if gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --name "$PACKAGE_NAME"; then
              exit 0
            fi
            status=$(gh run view "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
            test "$status" != completed
            sleep 10
          done
          exit 1

      - name: Unpack and verify the macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          ditto -x -k shrimply-macos-arm64.zip .
          codesign --verify --deep --strict Shrimply.app

      - name: Unpack the Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive "$env:RUNNER_TEMP/shrimply-windows-x86_64.zip" "$env:RUNNER_TEMP"

      - name: Verify two clients, remote playhead, and offline reconnect
        env:
          APP_ENTRY: ${{ matrix.executable }}
          SERVER_ENTRY: ${{ matrix.server }}
        shell: bash
        run: |
          server_args=("$SERVER_ENTRY")
          if [[ "$RUNNER_OS" == macOS ]]; then
            server_args=("$RUNNER_TEMP/server-current" "$RUNNER_TEMP/server-0.0.99" "$RUNNER_TEMP/server-0.1.1")
          fi
          python packaging/packaged-remote-smoke.py "$RUNNER_TEMP/$APP_ENTRY" "${server_args[@]}"
