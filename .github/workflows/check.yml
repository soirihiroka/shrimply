name: Verify packaged desktop editing sessions

on:
  workflow_dispatch:
    inputs:
      windows-run:
        description: Windows build run to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  TZ: UTC

jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Download and verify the published macOS app
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download prerelease-20261128T082127Z-e31db7a3c391 \
            --repo "$GITHUB_REPOSITORY" --pattern shrimply-macos-arm64.zip
          ditto -x -k shrimply-macos-arm64.zip .
          codesign --verify --deep --strict Shrimply.app
          echo "SHRIMPLY_EXE=$RUNNER_TEMP/Shrimply.app/Contents/MacOS/shrimply" >> "$GITHUB_ENV"
      - name: Download the hosted Windows app
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN: ${{ inputs.windows-run }}
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          gh run download $env:WINDOWS_RUN --repo $env:GITHUB_REPOSITORY --name shrimply-windows-x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive shrimply-windows-x86_64.zip app
          $exe = Join-Path $PWD app/shrimply.exe
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI --version exited $LASTEXITCODE" }
          "SHRIMPLY_EXE=$exe" >> $env:GITHUB_ENV
      - name: Verify shared edit, stale revision, history, and session restart
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          project=session.shrimp
          shrimply() { "$SHRIMPLY_EXE" "$@" --project "$project"; }
          trap 'shrimply project close || true' EXIT
          if creation=$(shrimply project create --name Original); then
            jq -e '.success and .result.created' <<<"$creation"
          else
            status=$?
            printf 'Project creation exited %s\n%s\n' "$status" "$creation" >&2
            exit "$status"
          fi
          revision=$(shrimply project get | jq -ber '.result.content_revision')
          for name in First Second; do
            (
              if shrimply project set --name "$name" --if-revision "$revision" > "$RUNNER_TEMP/$name.json"; then
                jq -e '.success' "$RUNNER_TEMP/$name.json"
              else
                jq -e '.success == false and .error.code == "revision_conflict"' "$RUNNER_TEMP/$name.json"
              fi
            ) &
            if [[ "$name" == First ]]; then first=$!; else second=$!; fi
          done
          wait "$first"
          wait "$second"
          jq -e -s 'map(select(.success)) | length == 1' "$RUNNER_TEMP"/{First,Second}.json
          if jq -e '.success' "$RUNNER_TEMP/First.json" >/dev/null; then winner=First; else winner=Second; fi
          shrimply project get | jq -e --arg name "$winner" '.result.project_name == $name'
          shrimply history undo | jq -e '.success and .result.changed'
          shrimply project get | jq -e '.result.project_name == "Original"'
          shrimply history redo | jq -e '.success and .result.changed'
          shrimply project get | jq -e --arg name "$winner" '.result.project_name == $name'
          shrimply project close | jq -e '.success and .result.saved and .result.closed and (.result.already_closed != true)'
          shrimply project get | jq -e --arg name "$winner" '.result.project_name == $name'
      - name: Verify the same editing commands on native Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          function Start-Shrimply([string[]]$Command) {
            $name = $Command[0..1] -join ' '
            Write-Host "Running $name"
            $prefix = [guid]::NewGuid().ToString()
            $process = Start-Process -FilePath $env:SHRIMPLY_EXE -PassThru -NoNewWindow `
              -ArgumentList ($Command + @('--project', 'session.shrimp')) `
              -RedirectStandardOutput "$prefix.json" -RedirectStandardError "$prefix.stderr"
            @{ Name = $name; Process = $process; Prefix = $prefix }
          }
          function Receive-Shrimply($Call) {
            if (!$Call.Process.WaitForExit(45000)) {
              Stop-Process -Id $Call.Process.Id -ErrorAction SilentlyContinue
              Write-Host (Get-Content -Raw "$($Call.Prefix).stderr")
              throw "$($Call.Name) did not exit within 45 seconds"
            }
            Write-Host (Get-Content -Raw "$($Call.Prefix).stderr")
            @{ Code = $Call.Process.ExitCode; Reply = Get-Content -Raw "$($Call.Prefix).json" | ConvertFrom-Json }
          }
          function Invoke-Shrimply([string[]]$Command) {
            $result = Receive-Shrimply (Start-Shrimply $Command)
            if ($result.Code -ne 0 -or !$result.Reply.success) { throw ($result.Reply | ConvertTo-Json -Depth 10) }
            $result.Reply.result
          }
          try {
            if (!(Invoke-Shrimply @('project','create','--name','Original')).created) { throw 'Creation failed' }
            $revision = (Invoke-Shrimply @('project','get')).content_revision
            $first = Start-Shrimply @('project','set','--name','First','--if-revision',$revision)
            $second = Start-Shrimply @('project','set','--name','Second','--if-revision',$revision)
            $results = (Receive-Shrimply $first), (Receive-Shrimply $second)
            $wins = @($results | Where-Object { $_.Code -eq 0 -and $_.Reply.success })
            $conflicts = @($results | Where-Object { $_.Code -ne 0 -and $_.Reply.error.code -eq 'revision_conflict' })
            if ($wins.Count -ne 1 -or $conflicts.Count -ne 1) { throw 'Expected one edit and one stale revision' }
            $winner = if ($results[0].Reply.success) { 'First' } else { 'Second' }
            if ((Invoke-Shrimply @('project','get')).project_name -ne $winner) { throw 'Edit was not visible' }
            if (!(Invoke-Shrimply @('history','undo')).changed -or (Invoke-Shrimply @('project','get')).project_name -ne 'Original') { throw 'Undo failed' }
            if (!(Invoke-Shrimply @('history','redo')).changed -or (Invoke-Shrimply @('project','get')).project_name -ne $winner) { throw 'Redo failed' }
            $closed = Invoke-Shrimply @('project','close')
            if (!$closed.saved -or !$closed.closed -or $closed.already_closed) { throw 'Daemon did not close' }
            if ((Invoke-Shrimply @('project','get')).project_name -ne $winner) { throw 'Restart lost the edit' }
          } finally {
            if (Test-Path session.shrimp.lock) { Invoke-Shrimply @('project','close') }
          }
