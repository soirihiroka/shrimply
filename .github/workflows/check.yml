name: Verify packaged macOS editing session

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  session:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Download and verify the published app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download prerelease-20261128T082127Z-e31db7a3c391 \
            --repo "$GITHUB_REPOSITORY" --pattern shrimply-macos-arm64.zip
          ditto -x -k shrimply-macos-arm64.zip .
          codesign --verify --deep --strict Shrimply.app
          echo "SHRIMPLY_EXE=$RUNNER_TEMP/Shrimply.app/Contents/MacOS/shrimply" >> "$GITHUB_ENV"
      - name: Verify shared edit, stale revision, history, and session restart
        shell: bash
        run: |
          project="$RUNNER_TEMP/session.shrimp"
          shrimply() { "$SHRIMPLY_EXE" "$@" --project "$project"; }
          trap 'shrimply project close || true' EXIT
          shrimply project create --name Original | jq -e '.success and .result.created'
          revision=$(shrimply project get | jq -er '.result.content_revision')
          shrimply project set --name Updated --if-revision "$revision" | jq -e '.success'
          if conflict=$(shrimply project set --name Stale --if-revision "$revision"); then
            echo "A stale project edit unexpectedly succeeded" >&2
            exit 1
          fi
          jq -e '.success == false and .error.code == "revision_conflict"' <<< "$conflict"
          shrimply project get | jq -e '.result.project_name == "Updated"'
          shrimply history undo | jq -e '.success and .result.changed'
          shrimply project get | jq -e '.result.project_name == "Original"'
          shrimply history redo | jq -e '.success and .result.changed'
          shrimply project get | jq -e '.result.project_name == "Updated"'
          shrimply project close | jq -e '.success'
          shrimply project get | jq -e '.result.project_name == "Updated"'
