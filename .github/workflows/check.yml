name: Android Cargo artifact cache experiment

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/setup-android
        id: setup

      - name: Cache compiled Cargo artifacts
        uses: actions/cache@v6
        with:
          path: |
            target/release
            target/aarch64-linux-android/release
          key: android-cargo-target-v1-${{ steps.setup.outputs.skia-key }}

      - name: Build the Android native library
        env:
          CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
        run: |
          # cc-rs only adopts RUSTC_WRAPPER for C compilers with a recognized basename.
          wrapper="$RUNNER_TEMP/sccache-rust"
          printf '%s\n' '#!/bin/sh' 'exec "$SCCACHE_PATH" "$@"' > "$wrapper"
          chmod +x "$wrapper"
          RUSTC_WRAPPER="$wrapper" make android-native ANDROID_PROFILE=release ANDROID_SDK_ROOT="$ANDROID_HOME"
          du -sh target/release target/aarch64-linux-android/release

      - name: Archive compiled Skia binaries
        id: skia-archive
        if: steps.setup.outputs.skia-hit != 'true'
        run: python3 packaging/cache-skia.py target/aarch64-linux-android/release/build "${SKIA_ARCHIVE}"

      - name: Save Android Skia binaries
        if: steps.skia-archive.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SKIA_ARCHIVE }}
          key: ${{ steps.setup.outputs.skia-key }}

      - name: Verify the Skia archive
        run: tar -tzf "${SKIA_ARCHIVE}"
