name: CI checks

on: workflow_dispatch

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Round-trip and compare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-numpy clang lld
          make test -o native-deps -o cuda-target-check ARGS='--locked --release -p shrimply-aac --example encode --no-run --message-format=json' > build.jsonl
          encoder=$(jq -r 'select(.reason? == "compiler-artifact" and .target.name == "encode") | .executable // empty' build.jsonl)
          /usr/bin/python3 vendor/aac/benchmark.py "$encoder" --smoke > aac-smoke.json
          /usr/bin/python3 vendor/aac/benchmark.py "$encoder" --bitrates 96 128 192 256 --repeat 2 > aac-native.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aac-results
          path: |
            aac-*.json
            build.jsonl
