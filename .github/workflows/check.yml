name: Verify packaged GTK project scrolling

on:
  workflow_dispatch:
    inputs:
      package-run:
        description: Flatpak package run to verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  TZ: UTC

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Install display and Flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak dbus-daemon xvfb xauth xdotool imagemagick
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install the exact hosted Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package-run }}
        run: |
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq .run_attempt)
          artifact="flatpak-$PACKAGE_RUN-$attempt"
          until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN/artifacts" --jq '.artifacts[].name' | grep -Fxq "$artifact"; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq .status)
            test "$state" != completed
            sleep 15
          done
          gh run download "$PACKAGE_RUN" --name "$artifact" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP"
          flatpak install --user --noninteractive "$RUNNER_TEMP/shrimply-gtk-x86_64.flatpak"
      - name: Open the launcher and scroll through its project list
        run: |
          timeout -k 5s 120s dbus-run-session -- xvfb-run -a bash -euo pipefail <<'BASH'
          shrimply() { flatpak run --user --socket=x11 --env=GDK_BACKEND=x11 --filesystem="$RUNNER_TEMP:rw" dev.shrimply.Shrimply "$@"; }
          mkdir -p "$RUNNER_TEMP/launcher-projects" "$RUNNER_TEMP/screenshots"
          for index in {00..63}; do
            shrimply project create --project "$RUNNER_TEMP/launcher-projects/$index.shrimp" --name "Scroll fixture $index" | jq -e '.result.created'
          done
          shrimply > "$RUNNER_TEMP/screenshots/launcher.log" 2>&1 &
          launcher=$!
          trap 'kill "$launcher" 2>/dev/null || true' EXIT
          window=$(timeout 20s xdotool search --sync --onlyvisible --name '^Shrimply$')
          xdotool windowfocus --sync "$window"
          sleep 1
          import -window "$window" "$RUNNER_TEMP/screenshots/top.png"
          xdotool mousemove --window "$window" 450 248 click --repeat 65 --delay 20 5
          sleep 1
          kill -0 "$launcher"
          import -window "$window" "$RUNNER_TEMP/screenshots/bottom.png"
          test "$(identify -format '%#' "$RUNNER_TEMP/screenshots/top.png")" != "$(identify -format '%#' "$RUNNER_TEMP/screenshots/bottom.png")"
          xdotool mousemove --window "$window" 400 64 click 1 type 'Scroll fixture 00'
          sleep 1
          kill -0 "$launcher"
          import -window "$window" "$RUNNER_TEMP/screenshots/search.png"
          ! grep -Eq 'panicked at|can only be placed into GtkListBox' "$RUNNER_TEMP/screenshots/launcher.log"
          BASH
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gtk-project-launcher
          path: ${{ runner.temp }}/screenshots
