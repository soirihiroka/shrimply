name: Verify packaged Flatpak remote editing

on:
  workflow_dispatch:
    inputs:
      package-run:
        description: Flatpak build run to verify
        required: true
        type: string
      server-run:
        description: Project server build run to verify
        required: true
        type: string
      media:
        description: Verify automatic media upload and offline metadata reads
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  TZ: UTC
  CHECK_MEDIA: ${{ inputs.media }}

jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Install the hosted Flatpak and load the project server
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package-run }}
          SERVER_RUN: ${{ inputs.server-run }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak dbus-daemon
          if [[ "$CHECK_MEDIA" == true ]]; then sudo apt-get install -y --no-install-recommends ffmpeg; fi
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq .run_attempt)
          gh run download "$PACKAGE_RUN" --name "flatpak-$PACKAGE_RUN-$attempt" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP"
          flatpak install --user --noninteractive "$RUNNER_TEMP/shrimply-gtk-x86_64.flatpak"
          flatpak info --user --show-commit dev.shrimply.Shrimply
          gh run download "$SERVER_RUN" --name shrimply-project-server-image --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP"
          for kind in PACKAGE SERVER; do
            run_variable="${kind}_RUN"
            sha=$(gh run view "${!run_variable}" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
            printf '%s_SHA=%s\n' "$kind" "$sha" >> "$GITHUB_ENV"
          done
          docker load < "$RUNNER_TEMP/shrimply-project-server.tar.gz"
      - name: Verify an offline edit syncs after signing in again
        shell: bash
        run: |
          sudo install -d -o 10001 -g 10001 "$RUNNER_TEMP/server-data"
          timeout -k 5s 150s dbus-run-session -- bash -euo pipefail <<'BASH'
          server=http://127.0.0.1:18788
          alice="$RUNNER_TEMP/alice.shrimp"
          bob="$RUNNER_TEMP/bob.shrimp"
          shrimply() {
            flatpak run --user --filesystem="$RUNNER_TEMP:rw" dev.shrimply.Shrimply "$@"
          }
          cleanup() {
            for project in "$alice" "$bob"; do
              if [[ -f "$project" ]]; then shrimply project close --project "$project" || true; fi
            done
            docker rm -f shrimply-session-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          start_server() {
            docker run -d --name shrimply-session-test \
              -p 127.0.0.1:18788:8788 \
              -v "$RUNNER_TEMP/server-data:/data" \
              -e SHRIMPLY_PROJECT_SERVER_USERNAME=editor \
              -e SHRIMPLY_PROJECT_SERVER_PASSWORD="$1" \
              shrimply-project-server:prerelease
            curl -fsS --max-time 2 --retry 15 --retry-connrefused --retry-delay 1 "$server/v1" |
              jq -e --arg sha "$SERVER_SHA" '.protocol == 3 and .git_hash == $sha'
          }
          login() {
            printf '%s\n' "$1" | shrimply project login --server "$server" --username editor | jq -e '.success'
          }
          await_result() {
            local path=$1 group=$2 verb=$3
            shift 3
            for _ in {1..30}; do
              if shrimply "$group" "$verb" --project "$path" | jq -e "$@"; then
                return
              fi
              sleep 1
            done
            return 1
          }
          await_name() {
            await_result "$1" project get --arg name "$2" '.success and .result.project_name == $name'
          }
          shrimply version | jq -e --arg sha "$PACKAGE_SHA" '.cli.git_hash == $sha'
          start_server first-ci-password
          old_token=$(curl -fsS -u editor:first-ci-password -X POST "$server/v1/login" | jq -er '.token')
          login first-ci-password
          printf 'Create the first remote workspace\n'
          id=$(shrimply project create --project "$alice" --server "$server" --name Original --fps 30 | jq -er '.result.location.id')
          printf 'Join from an independent workspace\n'
          shrimply project open --project "$bob" --server "$server" --remote-project-id "$id" | jq -e '.success and .result.ready'
          shrimply project set --project "$alice" --name Shared | jq -e '.success'
          await_name "$bob" Shared
          await_result "$bob" project get --arg sha "$SERVER_SHA" '.result.shared_project.server_version.git_hash == $sha'
          revision=$(shrimply project get --project "$alice" | jq -er '.result.content_revision')
          shrimply player seek --project "$bob" --frame 30 | jq -e '.success'
          await_result "$alice" project get --arg revision "$revision" '
            .success and .result.content_revision == $revision
            and any(.result.shared_project.participants[]; .position.seconds == {numerator: 1, denominator: 1})'
          alice_owner=$(cat "$alice.lock")
          bob_owner=$(cat "$bob.lock")
          docker rm -f shrimply-session-test
          shrimply project set --project "$bob" --name Offline | jq -e '.success'
          await_name "$bob" Offline
          start_server new-ci-password
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $old_token" "$server/v1/projects")" = 401
          shrimply project get --project "$alice" | jq -e '.result.project_name == "Shared"'
          login new-ci-password
          await_name "$alice" Offline
          shrimply history undo --project "$bob" | jq -e '.success and .result.changed'
          await_name "$alice" Shared
          test "$(cat "$alice.lock")" = "$alice_owner"
          test "$(cat "$bob.lock")" = "$bob_owner"
          if [[ "$CHECK_MEDIA" == true ]]; then
            video="$RUNNER_TEMP/shared.mp4"
            ffmpeg -v error -f lavfi -i 'nullsrc=s=640x360:r=24,noise=alls=100:allf=t+u' \
              -t 2 -c:v libx264 -preset ultrafast -qp 0 -movflags +faststart "$video"
            read -r digest _ < <(sha256sum "$video")
            size=$(stat -c %s "$video")
            test "$size" -gt 4194304
            body=$(jq -nc --arg source "$video" '{files:[{source:$source}],frame:0}')
            shrimply clips insert-files --project "$alice" --body "$body" --dry-run | jq -e '.success'
            shrimply clips insert-files --project "$alice" --body "$body" | jq -e '.success'
            clip=$(await_result "$bob" clips list -r --arg blob "blobs/$digest.mp4" \
              '.result.clips[] | select(.asset_path == $blob) | .address.item_id')
            token=$(curl -fsS -u editor:new-ci-password -X POST "$server/v1/login" | jq -er '.token')
            curl -fsS -H "Authorization: Bearer $token" -H 'Range: bytes=0-1023' \
              "$server/v1/projects/$id/blobs/$digest" > "$RUNNER_TEMP/media-prefix"
            cmp "$RUNNER_TEMP/media-prefix" <(head -c 1024 "$video")
            metadata() {
              shrimply clips inspect --project "$bob" --item-id "$clip" | jq -e --argjson size "$size" '
                .success and .result.source_error == null
                and .result.source.file.byte_size == $size and .result.source.file.canonical_path == null
                and any(.result.source.streams[]; .video.width == 640 and .video.height == 360)'
            }
            metadata
            read -r workspace _ < <(printf '%s' "$(realpath "$bob")" | sha256sum)
            cache="$HOME/.var/app/dev.shrimply.Shrimply/cache/shrimply/shared-media/$workspace"
            cached=$(find "$cache" -type f -name '*.range' -printf '%s\n' | awk '{ bytes += $1 } END { print bytes + 0 }')
            test "$cached" -gt 0
            test "$cached" -lt "$size"
            test -z "$(find "$cache" -type f -name '*.asset' -print -quit)"
            docker rm -f shrimply-session-test
            shrimply project close --project "$bob" | jq -e '.success and .result.closed'
            metadata
            test "$(cat "$bob.lock")" != "$bob_owner"
          fi
          BASH
