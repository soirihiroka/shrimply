name: CI checks

on:
  workflow_dispatch:
    inputs:
      comparison:
        type: boolean
        default: false
      export:
        type: boolean
        default: false
      cache:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audio:
    if: '!inputs.cache'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Round-trip and compare
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-numpy clang lld
          make -s test -o native-deps -o cuda-target-check ARGS='--locked --release -p shrimply-aac --lib'
          make -s test -o native-deps -o cuda-target-check ARGS='--locked --release -p shrimply-aac --example encode --no-run --message-format=json' > build.jsonl
          encoder=$(jq -r 'select(.reason? == "compiler-artifact" and .target.name == "encode") | .executable // empty' build.jsonl)
          test -x "$encoder"
          echo "AAC_ENCODER=$encoder" >> "$GITHUB_ENV"
          /usr/bin/python3 vendor/aac/benchmark.py "$encoder" --smoke > aac-smoke.json
      - name: Compare pinned FFmpeg and FDK AAC
        if: inputs.comparison
        run: |
          sudo apt-get install -y nasm
          curl -fsSL --retry 3 https://github.com/mstorsjo/fdk-aac/archive/refs/tags/v2.0.3.tar.gz -o "$RUNNER_TEMP/fdk.tar.gz"
          echo "e25671cd96b10bad896aa42ab91a695a9e573395262baed4e4a2ff178d6a3a78  $RUNNER_TEMP/fdk.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/fdk.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/fdk-aac-2.0.3" -B "$RUNNER_TEMP/fdk-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/fdk" -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=OFF
          cmake --build "$RUNNER_TEMP/fdk-build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/fdk-build"
          mkdir "$RUNNER_TEMP/ffmpeg"
          (
            cd "$RUNNER_TEMP/ffmpeg"
            PKG_CONFIG_PATH="$RUNNER_TEMP/fdk/lib/pkgconfig" "$GITHUB_WORKSPACE/external/ffmpeg/configure" \
              --disable-autodetect --disable-everything --disable-doc --disable-ffplay --disable-ffprobe \
              --enable-nonfree --enable-libfdk-aac --enable-encoder=aac,libfdk_aac,pcm_f32le,pcm_s16le \
              --enable-decoder=aac,libfdk_aac,pcm_f32le,pcm_s16le,flac --enable-parser=aac,flac \
              --enable-muxer=adts,pcm_f32le,wav --enable-demuxer=aac,pcm_f32le,wav,flac \
              --enable-filter=aresample,aformat,anull --enable-protocol=file,pipe
            make -j "$(nproc)" ffmpeg
          )
          export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          curl -fsSL --retry 3 'https://qc.ebu.io/testmaterials/523/1/download/' -o "$RUNNER_TEMP/sqam.zip"
          mkdir "$RUNNER_TEMP/sqam"
          unzip -j "$RUNNER_TEMP/sqam.zip" 27.flac 35.flac 42.flac 48.flac 49.flac 50.flac -d "$RUNNER_TEMP/sqam"
          /usr/bin/python3 vendor/aac/benchmark.py "$AAC_ENCODER" --fdk --bitrates 64 96 128 192 256 320 --repeat 3 --corpus "$RUNNER_TEMP"/sqam/*.flac > aac-comparison.json
      - name: Add ViSQOL audio scores
        if: inputs.comparison
        run: |
          git clone --depth 1 --branch v3.3.3 https://github.com/google/visqol.git "$RUNNER_TEMP/visqol"
          sed -i 's|http://sourceforge.net/projects/arma/files/armadillo-9.860.2.tar.xz|https://distfiles.macports.org/armadillo/armadillo-9.860.2.tar.xz|' "$RUNNER_TEMP/visqol/WORKSPACE"
          curl -fsSL --retry 3 https://releases.bazel.build/5.1.0/release/bazel-5.1.0-linux-x86_64 -o "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          (cd "$RUNNER_TEMP/visqol" && "$RUNNER_TEMP/bazel" --batch build :visqol -c opt)
          export PATH="$RUNNER_TEMP/ffmpeg:$PATH"
          /usr/bin/python3 vendor/aac/benchmark.py "$AAC_ENCODER" --fdk --bitrates 96 128 192 256 --repeat 2 \
            --corpus "$RUNNER_TEMP"/sqam/*.flac --visqol "$RUNNER_TEMP/visqol/bazel-bin/visqol" \
            "$RUNNER_TEMP/visqol/model/libsvm_nu_svr_model.txt" > aac-perceptual.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aac-results
          path: |
            aac-*.json
            build.jsonl
            Cargo.lock


  export:
    if: inputs.export
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          profile: debug
      - run: make appkit-ffmpeg test DEV_BUILD_ENV='$(APPKIT_BUILD_ENV)' ARGS='--locked --lib -p shrimply-export-core audio::tests::exports_all_audio_formats'


  cache:
    if: inputs.cache
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup-macos
        with:
          profile: release
      - name: Inspect restored compiled dependencies
        run: |
          test -d target/release/.fingerprint
          find target/release/.fingerprint -mindepth 1 -maxdepth 1 -type d | wc -l
