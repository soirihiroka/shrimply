name: CI checks

on:
  push:
    branches: [android]
  pull_request:
    branches: [main, android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Free space for native build dependencies
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.nixos-cuda.org https://shrimply.cachix.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= shrimply.cachix.org-1:cAgdyBbGPgJZMWUP4PAQPVENeCYtGT7OPPkocvo+uuA=
      - name: Check shared Rust, GTK, and Qt
        run: nix develop --accept-flake-config --command make export-check check

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/setup-macos
        id: setup
        with:
          profile: debug

      - name: Check AppKit and run Clippy
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: make check

      - name: Save macOS check cache
        if: steps.setup.outputs.application-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/debug
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ steps.setup.outputs.application-key }}

  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-windows

      - name: Check Windows and run Clippy
        shell: powershell
        env:
          CARGO_BUILD_JOBS: "3"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          $env:PATH += ";C:\Program Files\Git\bin;C:\Program Files\Git\usr\bin"
          make windows-check

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-build-diagnostics
          path: |
            .ci/ffmpeg-validation/*.log
            .ci/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/setup-android

      - name: Check Android Rust and Kotlin
        run: make android-check ANDROID_PROFILE=release ANDROID_SDK_ROOT="${ANDROID_HOME}"

      - name: Upload Android lint report
        uses: actions/upload-artifact@v6
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: error
