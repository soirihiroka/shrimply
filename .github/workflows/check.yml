name: AAC encoding CPU profile
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  TZ: UTC
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the optimized encoder and prepare the same PCM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg clang lld linux-tools-generic
          make -s test -o native-deps -o cuda-target-check ARGS='--locked --release -p shrimply-aac --example encode --no-run --message-format=json' > build.jsonl
          encoder=$(jq -r 'select(.reason? == "compiler-artifact" and .target.name == "encode") | .executable // empty' build.jsonl)
          test -x "$encoder"
          echo "AAC_ENCODER=$encoder" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 'https://qc.ebu.io/testmaterials/523/1/download/' -o sqam.zip
          unzip -j sqam.zip 44.flac 69.flac
          for item in 44 69; do
            ffmpeg -v error -ss 4 -i "$item.flac" -t 8 -c:a pcm_s16le "$item.wav"
            ffmpeg -v error -i "$item.wav" -map 0:a:0 -f f32le -ac 2 -ar 48000 "$item.f32"
          done
          sha256sum -c <<'CHECKSUM'
          9d7f39e72ab1062efbbce878fd0c5a2091c5b3534c5b28c36a0e12c571403f31  44.f32
          b51a9482618ba7ff675adae42108ba12cd333cd1e7d8d7a4c718f44e0bb2128a  69.f32
          CHECKSUM
      - name: Sample encoding on two matched-benchmark excerpts
        run: |
          cd "$RUNNER_TEMP"
          perf=$(find /usr/lib/linux-tools -name perf -type f | sort -V | tail -1)
          test -x "$perf"
          for item in 44 69; do
            for rate in 64000 192000; do
              sudo "$perf" record -q -e cpu-clock:u -F 499 --call-graph dwarf -o "$item-$rate.data" -- \
                "$AAC_ENCODER" "$item.f32" "$item-$rate.aac" 48000 "$rate"
              sudo "$perf" report --stdio --no-children --percent-limit 0.5 --call-graph none -i "$item-$rate.data" \
                > "$item-$rate-leaves.txt"
              sudo "$perf" report --stdio --percent-limit 2 -i "$item-$rate.data" > "$item-$rate-stacks.txt"
              grep -q 'shrimply_aac' "$item-$rate-leaves.txt"
              head -30 "$item-$rate-leaves.txt"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aac-cpu-profile
          path: |
            ${{ runner.temp }}/*-leaves.txt
            ${{ runner.temp }}/*-stacks.txt
