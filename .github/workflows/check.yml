name: CI checks

on:
  push:
    branches: [android]
  pull_request:
    branches: [main, android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Free space for native build dependencies
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://cache.nixos-cuda.org https://shrimply.cachix.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M= shrimply.cachix.org-1:cAgdyBbGPgJZMWUP4PAQPVENeCYtGT7OPPkocvo+uuA=
      - name: Check shared Rust, GTK, and Qt
        run: nix develop --accept-flake-config --command make check

  macos:
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      check_only: true

  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      check_only: true

  android:
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      check_only: true
    secrets: inherit
