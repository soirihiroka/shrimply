name: Windows prerelease

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows.yml"
      - ".github/workflows/publish-zip.yml"
      - ".github/actions/cache-cargo/**"
      - ".github/actions/setup-windows/**"
      - ".github/scripts/publish-prerelease.sh"
      - "packaging/windows/**"
      - "packaging/cache-skia.py"
      - "packaging/windows-ffmpeg.py"
      - "packaging/native_sources.py"
      - ".cargo/**"
      - ".gitmodules"
      - "assets/**"
      - "crates/**"
      - "sanim/crates/**"
      - "sanim/Cargo.toml"
      - "sanim/Cargo.lock"
      - "external/**"
      - "vendor/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "rust-toolchain.toml"
      - "!**/*.md"
      - "!**/*.rst"
      - "!**/docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  build:
    concurrency:
      group: windows-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-windows
        id: setup

      - name: Cache compiled Cargo artifacts
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_TARGET_DIR }}/release
          key: windows-cargo-target-v1-${{ steps.setup.outputs.native-cache-key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'sanim/**/Cargo.toml', 'vendor/**/Cargo.toml', 'external/**/Cargo.toml', 'external/optix-dev/include/**', 'rust-toolchain.toml', '.cargo/config.toml', 'Makefile', 'packaging/windows/windows-release.ps1', '.github/actions/setup-windows/action.yml') }}

      - name: Package portable application
        shell: powershell
        run: make windows-package

      - name: Archive compiled Skia binaries
        id: skia-archive
        if: steps.setup.outputs.skia-hit != 'true'
        shell: powershell
        run: python packaging/cache-skia.py "$env:CARGO_TARGET_DIR/release/build" "$env:SKIA_ARCHIVE"

      - name: Save Windows Skia binaries
        if: steps.skia-archive.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SKIA_ARCHIVE }}
          key: ${{ steps.setup.outputs.skia-key }}

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: shrimply-windows-x86_64
          path: dist/shrimply-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-diagnostics
          path: |
            .ci/ffmpeg-validation/*.log
            .ci/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  publish:
    needs: build
    uses: ./.github/workflows/publish-zip.yml
    permissions:
      contents: write
    with:
      artifact: shrimply-windows-x86_64
