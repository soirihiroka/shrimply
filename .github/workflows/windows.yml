name: Windows

on:
  push:
    branches: [windows]
    paths:
      - ".github/workflows/windows.yml"
      - "packaging/windows/**"
      - "crates/**"
      - "external/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "rust-toolchain.toml"
      - "vcpkg.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}\.ci\cargo
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  RUSTUP_HOME: ${{ github.workspace }}\.ci\rustup
  TZ: UTC
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
  VCPKGRS_DYNAMIC: "1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check out pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: e93e1f6ab41a22fe711b1045dbbac5cbc9db60af
          path: .ci/vcpkg
          persist-credentials: false

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install host tools
        shell: powershell
        run: choco install make pkgconfiglite ripgrep uv --yes --no-progress

      - name: Restore Rust and application caches
        uses: actions/cache@v6
        with:
          path: |
            .ci/cargo/bin
            .ci/cargo/registry
            .ci/cargo/git
            .ci/rustup
            target/release
          key: windows-rust-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'Makefile') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'Makefile') }}-
            windows-rust-v1-

      - name: Install pinned Rust toolchain
        shell: powershell
        run: |
          if (!(Test-Path "$env:CARGO_HOME\bin\rustup.exe")) {
            $installer = "$env:RUNNER_TEMP\rustup-init.exe"
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal
          }
          "$env:CARGO_HOME\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "$env:CARGO_HOME\bin\rustup.exe" show

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: https://github.com/miurahr/aqtinstall/archive/076e1659807d0b362a3ed684d54c2e9c775eb9c7.zip
          cache: true
          cache-key-prefix: windows-qt-6.11.1-msvc2022-aqt-076e1659

      - name: Restore installed CUDA 12.9.2
        id: cuda-cache
        uses: actions/cache/restore@v6
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
          key: windows-cuda-12.9.2-v1

      - name: Install CUDA 12.9.2
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: 12.9.2
          method: local
          sub-packages: '["nvcc", "cudart"]'
          use-github-cache: true

      - name: Export CUDA environment
        shell: powershell
        run: |
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9"
          if (!(Test-Path "$cuda\bin\nvcc.exe")) { throw "CUDA 12.9 nvcc.exe is missing" }
          "CUDA_PATH=$cuda" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CUDA_PATH_V12_9=$cuda" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$cuda\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Save installed CUDA 12.9.2
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.9
          key: windows-cuda-12.9.2-v1

      - name: Restore vcpkg caches
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .ci/vcpkg/downloads
            .ci/vcpkg/binary-cache
          key: windows-vcpkg-v1-${{ hashFiles('vcpkg.json') }}

      - name: Install native libraries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force .ci/vcpkg/binary-cache | Out-Null
          & .ci/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          $env:VCPKG_BINARY_SOURCES = "clear;files,$pwd\.ci\vcpkg\binary-cache,readwrite"
          & .ci/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root . --x-install-root "$env:VCPKG_INSTALLED_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save compiled vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .ci/vcpkg/downloads
            .ci/vcpkg/binary-cache
          key: windows-vcpkg-v1-${{ hashFiles('vcpkg.json') }}

      - name: Export native build environment
        shell: powershell
        run: |
          $linker = (Get-Command link.exe -ErrorAction Stop).Source
          if ($linker -notlike "*Microsoft Visual Studio*") { throw "MSVC link.exe not found: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKG_ROOT=$pwd\.ci\vcpkg" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLED_DIR\x64-windows\lib\pkgconfig;$env:VCPKG_INSTALLED_DIR\x64-windows\share\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CLANG_PATH=C:\Program Files\LLVM\bin\clang.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "QT_QMAKE=qmake.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$env:VCPKG_INSTALLED_DIR\x64-windows\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Check Windows build
        shell: bash
        run: make check

      - name: Build Windows release
        shell: bash
        run: make windows-release

      - name: Package portable application
        shell: bash
        run: make windows-package

      - name: Verify portable application
        shell: powershell
        run: packaging/windows/verify.ps1

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: shrimply-windows-x86_64
          path: |
            dist/shrimply-windows-x86_64.zip
            dist/shrimply-windows-x86_64.zip.sha256
          if-no-files-found: error
