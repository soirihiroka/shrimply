name: Android prerelease

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - ".github/scripts/publish-prerelease.sh"
      - "android/**"
      - "packaging/android-*.py"
      - "packaging/cache-skia.py"
      - "packaging/native_sources.py"
      - "packaging/*.patch"
      - ".cargo/**"
      - ".gitmodules"
      - "assets/**"
      - "crates/**"
      - "sanim/crates/**"
      - "sanim/Cargo.toml"
      - "sanim/Cargo.lock"
      - "external/**"
      - "vendor/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "rust-toolchain.toml"
      - "!**/*.md"
      - "!**/*.rst"
      - "!**/docs/**"
  workflow_dispatch:
    inputs:
      check_only:
        description: Build and check without publishing a prerelease
        type: boolean
        default: false
  workflow_call:
    inputs:
      check_only:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.check_only && 'check' || 'prerelease' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      ANDROID_NDK_VERSION: "28.2.13676358"
      SKIA_ARCHIVE: target/android-skia.tar.gz
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Free space for the Android build
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake build-essential clang cmake curl gettext \
            libclang-dev libglib2.0-dev-bin libtool nasm ninja-build patch pkg-config ripgrep spirv-tools zip

      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.12
          enable-cache: true

      - name: Install Meson
        run: |
          uv tool install meson==1.11.2
          echo "$(uv tool dir --bin)" >> "${GITHUB_PATH}"

      - name: Install Rust and Android SDK components
        run: |
          rustup show
          export JAVA_HOME="${JAVA_HOME_21_X64}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-release-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'android/**/*.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-release-v1-${{ runner.os }}-

      - name: Read the pinned FFmpeg commit
        id: ffmpeg
        run: echo "revision=$(git rev-parse :external/ffmpeg)" >> "${GITHUB_OUTPUT}"

      - uses: actions/cache/restore@v6
        id: android-native-cache
        with:
          path: |
            target/android-native/arm64-v8a/release/install
            target/android-native/arm64-v8a/release/*.sha256
          key: android-native-v1-${{ runner.os }}-arm64-v8a-release-${{ steps.ffmpeg.outputs.revision }}-${{ hashFiles('Cargo.lock', 'Makefile', 'packaging/android-*.py', 'packaging/native_sources.py', 'packaging/*.patch') }}
          restore-keys: android-native-v1-${{ runner.os }}-arm64-v8a-release-

      - name: Build Android native dependencies
        run: make android-pdf-deps ANDROID_PROFILE=release ANDROID_SDK_ROOT="${ANDROID_HOME}"

      - uses: actions/cache/save@v6
        if: steps.android-native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target/android-native/arm64-v8a/release/install
            target/android-native/arm64-v8a/release/*.sha256
          key: ${{ steps.android-native-cache.outputs.cache-primary-key }}

      - name: Restore Android Skia binaries
        id: skia-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SKIA_ARCHIVE }}
          key: android-skia-v1-${{ runner.os }}-${{ runner.arch }}-arm64-v8a-${{ env.ANDROID_NDK_VERSION }}-${{ steps.android-native-cache.outputs.cache-primary-key }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'sanim/**/Cargo.toml', 'external/**/Cargo.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}

      - name: Use cached Skia binaries
        if: steps.skia-cache.outputs.cache-hit == 'true'
        run: echo "SKIA_BINARIES_URL=file://${GITHUB_WORKSPACE}/${SKIA_ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Build the Android native library on a Skia cache miss
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: make android-native ANDROID_PROFILE=release ANDROID_SDK_ROOT="${ANDROID_HOME}"

      - name: Archive compiled Skia binaries
        id: skia-archive
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: python3 packaging/cache-skia.py target/aarch64-linux-android/release/build "${SKIA_ARCHIVE}"

      - name: Save Android Skia binaries
        if: steps.skia-archive.outputs.ready == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SKIA_ARCHIVE }}
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}

      - name: Build and check the release APK
        run: make android-check ANDROID_PROFILE=release ANDROID_SDK_ROOT="${ANDROID_HOME}"

      - name: Sign, verify, and package the release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing Android release keystore}"
          : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?Missing Android release keystore password}"
          umask 077
          keystore="${RUNNER_TEMP}/shrimply-android-release.p12"
          trap 'rm -f "${keystore}"' EXIT
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          mkdir -p dist
          apk="dist/shrimply-android-arm64.apk"
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" sign \
            --ks "${keystore}" --ks-key-alias shrimply-release \
            --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --v4-signing-enabled false --out "${apk}" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apk}"
          python3 packaging/android-check.py "${apk}" \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "${ANDROID_HOME}"
          (cd dist && zip -9 -q shrimply-android-arm64.zip shrimply-android-arm64.apk && sha256sum shrimply-android-arm64.zip > shrimply-android-arm64.zip.sha256)

      - name: Upload signed release APK ZIP
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: shrimply-android-arm64
          path: |
            dist/shrimply-android-arm64.zip
            dist/shrimply-android-arm64.zip.sha256
          if-no-files-found: error

      - name: Upload lint report
        uses: actions/upload-artifact@v6
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && !inputs.check_only
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v6
        with:
          name: shrimply-android-arm64
          path: dist

      - name: Verify release archive
        run: |
          (cd dist && sha256sum --check --strict shrimply-android-arm64.zip.sha256)
          unzip -tq dist/shrimply-android-arm64.zip

      - name: Publish prerelease
        run: |
          bash .github/scripts/publish-prerelease.sh \
            "dist/shrimply-android-arm64.zip"
