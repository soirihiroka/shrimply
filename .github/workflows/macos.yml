name: macOS prerelease

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos.yml"
      - ".github/scripts/**"
      - "packaging/macos/**"
      - "packaging/macos-ffmpeg.py"
      - "packaging/native_sources.py"
      - "packaging/bundle-pyav.py"
      - ".cargo/**"
      - ".gitmodules"
      - "assets/**"
      - "crates/**"
      - "sanim/crates/**"
      - "sanim/Cargo.toml"
      - "sanim/Cargo.lock"
      - "external/**"
      - "vendor/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "rust-toolchain.toml"
      - "!**/*.md"
      - "!**/*.rst"
      - "!**/docs/**"
  workflow_dispatch:
    inputs:
      check_only:
        description: Run debug checks without packaging or publishing a release
        type: boolean
        default: false
  workflow_call:
    inputs:
      check_only:
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: macos-${{ inputs.check_only && 'check' || 'prerelease' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  CARGO_HOME: ${{ github.workspace }}/.ci/cargo
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
  MACOS_APP: dist/Shrimply.app
  MACOS_ARCHIVE: dist/shrimply-macos-arm64.zip
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  RUSTUP_HOME: ${{ github.workspace }}/.ci/rustup

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install host build dependencies
        run: |
          brew install \
            dylibbundler \
            ffmpeg \
            librsvg \
            llvm@22 \
            pkgconf \
            poppler \
            ripgrep \
            rubberband \
            uv

      - name: Restore Rust toolchain
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin
            ${{ env.RUSTUP_HOME }}
          key: rust-v2-macos-26-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install Rust toolchain
        run: |
          if [[ ! -x "${CARGO_HOME}/bin/rustup" ]]; then
            rustup_init="${RUNNER_TEMP}/rustup-init"
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              https://sh.rustup.rs \
              --output "${rustup_init}"
            chmod +x "${rustup_init}"
            "${rustup_init}" --yes --default-toolchain none --profile minimal
          fi
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/rustup" show

      - name: Save Rust toolchain
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/bin
            ${{ env.RUSTUP_HOME }}
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Resolve application cache key
        id: application-cache-key
        shell: bash
        run: |
          native_versions="$(brew list --versions)"
          native_hash="$(printf '%s\n' "${ImageOS}" "${ImageVersion}" "${native_versions}" "$(git -C external/ffmpeg rev-parse HEAD)" \
            | LC_ALL=C sort | shasum -a 256 | cut -d ' ' -f 1)"
          echo "prefix=macos-application-v2${{ inputs.check_only && '-debug' || '' }}-macos-26-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${native_hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore macOS application cache
        id: application-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/${{ inputs.check_only && 'debug' || 'release' }}
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ steps.application-cache-key.outputs.prefix }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'external/**/Cargo.toml', '.cargo/config.toml', 'Makefile', '.github/workflows/macos.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.application-cache-key.outputs.prefix }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'external/**/Cargo.toml', '.cargo/config.toml', 'Makefile', '.github/workflows/macos.yml') }}-
            ${{ steps.application-cache-key.outputs.prefix }}-

      - name: Cache hardware-only FFmpeg
        uses: actions/cache@v6
        with:
          path: target/macos-ffmpeg
          key: ${{ steps.application-cache-key.outputs.prefix }}-ffmpeg-${{ hashFiles('packaging/native_sources.py', 'packaging/macos-ffmpeg.py', 'packaging/macos/ffmpeg-hardware.patch') }}

      - name: Cache PocketSphinx resources
        uses: actions/cache@v6
        with:
          path: target/pocketsphinx-cache
          key: pocketsphinx-model-v1-${{ runner.os }}-${{ hashFiles('vendor/pocketsphinx/build.rs') }}

      - name: Build AppKit release
        if: ${{ !inputs.check_only }}
        run: make appkit-release

      - name: Check AppKit debug build
        if: inputs.check_only
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: make appkit-check fmt source-size-check

      - name: Save macOS application cache
        id: save-application-cache
        if: ${{ success() && steps.application-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            target/${{ inputs.check_only && 'debug' || 'release' }}
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ steps.application-cache.outputs.cache-primary-key }}

      - name: Prune old macOS application caches
        if: github.ref == 'refs/heads/main' && !inputs.check_only && steps.save-application-cache.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.application-cache.outputs.cache-primary-key }}
        run: |
          bash .github/scripts/prune-application-caches.sh "${CACHE_KEY}" \
            "macos-application-v2-macos-26-${{ runner.arch }}-" \
            "macos-application-prebuilt-macos-26-${{ runner.arch }}-"

      - name: Assemble application bundle
        if: ${{ !inputs.check_only }}
        shell: bash
        run: |
          contents="${MACOS_APP}/Contents"
          mkdir -p "${contents}/Frameworks" "${contents}/MacOS" "${contents}/Resources/licenses"
          install -m 755 target/release/shrimply "${contents}/MacOS/shrimply"
          install -m 755 target/macos-ffmpeg/install/bin/ffmpeg "${contents}/MacOS/shrimply-ffmpeg"
          install -m 644 packaging/macos/Info.plist "${contents}/Info.plist"
          install -m 644 vendor/vision/LICENSE "${contents}/Resources/licenses/OpenCV-Vision.txt"
          install -m 644 crates/math/color/src/css/LICENSE "${contents}/Resources/licenses/GTK-Pango-Color.txt"
          install -m 644 crates/math/color/src/css/NOTICE "${contents}/Resources/licenses/GTK-Pango-Color-NOTICE.txt"
          install -m 755 "$(command -v uv)" "${contents}/MacOS/uv"
          python_project="crates/media/visual/manim/manim-bridge/python"
          bundled_project="${contents}/Resources/manim-worker"
          mkdir -p "${bundled_project}"
          rsync -a --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' --exclude='uv.lock' \
            "${python_project}/" "${bundled_project}/"
          manim_revision="$(git -C external/manim rev-parse HEAD)"
          sed "s|^manimgl = .*|manimgl = { url = \"https://github.com/3b1b/manim/archive/${manim_revision}.tar.gz\" }|" \
            "${python_project}/pyproject.toml" > "${bundled_project}/pyproject.toml"
          uv run --no-project --python 3.14 python packaging/bundle-pyav.py \
            "${python_project}" "${bundled_project}" --prefix target/macos-ffmpeg/install
          uv lock --python 3.14 --project "${bundled_project}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "${contents}/Info.plist"

          cp target/macos-icon/Assets.car target/macos-icon/Shrimply.icns "${contents}/Resources/"

          # The application binaries and PyAV extensions load from different
          # directories; each carries a relative path to the same Frameworks.
          binaries=("${contents}/MacOS/shrimply" "${contents}/MacOS/shrimply-ffmpeg" "${contents}/MacOS/uv")
          while IFS= read -r -d '' extension; do binaries+=("${extension}"); done \
            < <(find "${bundled_project}/av" -name '*.so' -print0)
          fix_files=()
          for binary in "${binaries[@]}"; do fix_files+=(--fix-file "${binary}"); done
          bundle_log="${RUNNER_TEMP}/dylibbundler.log"
          if ! dylibbundler \
            --bundle-deps \
            --overwrite-dir \
            "${fix_files[@]}" \
            --dest-dir "${contents}/Frameworks" \
            --install-path '@rpath/' \
            > "${bundle_log}" 2>&1; then
            tail -n 200 "${bundle_log}"
            exit 1
          fi

          for binary in "${binaries[@]}"; do
            relative="$(python3 -c 'import os,sys; print(os.path.relpath(sys.argv[1], os.path.dirname(sys.argv[2])))' "${contents}/Frameworks" "${binary}")"
            rpath="@loader_path/${relative}"
            if ! otool -l "${binary}" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }' | grep -Fx "${rpath}" >/dev/null; then
              install_name_tool -add_rpath "${rpath}" "${binary}"
            fi
          done
          find "${contents}/MacOS" "${contents}/Frameworks" -type f -print0 \
            | while IFS= read -r -d '' binary; do
                otool -l "${binary}" \
                  | awk '/cmd LC_RPATH/ { getline; getline; sub(/^[[:space:]]*path /, ""); sub(/ \(offset.*$/, ""); count[$0]++ } END { for (path in count) for (i = 1; i < count[path]; i++) print path }' \
                  | while IFS= read -r duplicate; do
                      install_name_tool -delete_rpath "${duplicate}" "${binary}" 2>> "${bundle_log}"
                    done
              done
          find "${bundled_project}/av" -name '*.so' -exec codesign --force --sign - {} \;
          xattr -cr "${MACOS_APP}"
          codesign --force --deep --sign - "${MACOS_APP}"

      - name: Verify application bundle
        if: ${{ !inputs.check_only }}
        shell: bash
        run: |
          contents="${MACOS_APP}/Contents"
          plutil -lint "${contents}/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${contents}/Info.plist")" = "Shrimply"
          test -s "${contents}/Resources/Assets.car"
          test -s "${contents}/Resources/Shrimply.icns"
          cmp vendor/vision/LICENSE "${contents}/Resources/licenses/OpenCV-Vision.txt"
          cmp crates/math/color/src/css/LICENSE "${contents}/Resources/licenses/GTK-Pango-Color.txt"
          cmp crates/math/color/src/css/NOTICE "${contents}/Resources/licenses/GTK-Pango-Color-NOTICE.txt"
          codesign --verify --deep --strict "${MACOS_APP}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${contents}/Info.plist")" = "shrimply"
          test "$(lipo -archs "${contents}/MacOS/shrimply")" = "arm64"
          env PATH=/usr/bin:/bin "${contents}/MacOS/uv" --version
          ffmpeg_version="$(env PATH=/usr/bin:/bin "${contents}/MacOS/shrimply-ffmpeg" -version)"
          test "$(awk 'NR == 1 {print $3}' <<< "${ffmpeg_version}")" = "$(cat external/ffmpeg/RELEASE)"
          test -s "${contents}/Resources/manim-worker/pyproject.toml"
          test -s "${contents}/Resources/manim-worker/uv.lock"
          test ! -d "${contents}/Resources/manim-worker/.venv"

          worker="${contents}/Resources/manim-worker"
          EXPECTED_FFMPEG="$(cat external/ffmpeg/RELEASE)" PYTHONPATH="${worker}" \
            "${contents}/MacOS/uv" run --no-project --python 3.14 python -c \
              'import av, os; assert av.ffmpeg_version_info == os.environ["EXPECTED_FFMPEG"], av.ffmpeg_version_info'
          dependencies="${RUNNER_TEMP}/macos-dependencies.txt"
          { find "${contents}/MacOS" "${contents}/Frameworks" -type f -print0
            find "${worker}/av" -name '*.so' -print0; } | xargs -0 otool -L > "${dependencies}"
          external_dependencies="$(awk '$1 ~ /^\// && $1 !~ /^\/System\/Library\// && $1 !~ /^\/usr\/lib\// { print $1 }' "${dependencies}")"
          if [[ -n "${external_dependencies}" ]]; then
            echo "Application bundle retains external dependencies:" >&2
            echo "${external_dependencies}" >&2
            exit 1
          fi

          if "${contents}/MacOS/shrimply" "${RUNNER_TEMP}/missing.shrimp"; then
            echo "Launcher unexpectedly accepted a missing project" >&2
            exit 1
          fi
          if "${contents}/MacOS/shrimply" first.shrimp second.shrimp; then
            echo "Editor unexpectedly accepted multiple projects" >&2
            exit 1
          fi

      - name: Create and verify archive
        if: ${{ !inputs.check_only }}
        run: |
          archive_name="$(basename "${MACOS_ARCHIVE}")"
          ditto -c -k --sequesterRsrc --keepParent "${MACOS_APP}" "${MACOS_ARCHIVE}"
          (
            cd "$(dirname "${MACOS_ARCHIVE}")"
            shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
            shasum -a 256 --check "${archive_name}.sha256"
          )

          unpacked="${RUNNER_TEMP}/shrimply-macos-verify"
          mkdir -p "${unpacked}"
          ditto -x -k "${MACOS_ARCHIVE}" "${unpacked}"
          codesign --verify --deep --strict "${unpacked}/Shrimply.app"
          test -s "${MACOS_ARCHIVE}.sha256"

      - name: Publish prerelease
        if: github.ref == 'refs/heads/main' && !inputs.check_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-prerelease.sh \
            "${MACOS_ARCHIVE}"
