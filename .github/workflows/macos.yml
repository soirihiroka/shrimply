name: macOS prerelease

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos.yml"
      - ".github/workflows/publish-zip.yml"
      - ".github/actions/cache-cargo/**"
      - ".github/actions/setup-macos/**"
      - ".github/scripts/**"
      - "packaging/macos/**"
      - "packaging/macos-ffmpeg.py"
      - "packaging/native_sources.py"
      - ".cargo/**"
      - ".gitmodules"
      - "assets/**"
      - "crates/**"
      - "sanim/crates/**"
      - "sanim/Cargo.toml"
      - "sanim/Cargo.lock"
      - "external/**"
      - "vendor/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Makefile"
      - "rust-toolchain.toml"
      - "!**/*.md"
      - "!**/*.rst"
      - "!**/docs/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: UTC
  MACOS_APP: dist/Shrimply.app
  MACOS_ARCHIVE: dist/shrimply-macos-arm64.zip

jobs:
  build:
    concurrency:
      group: macos-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: macos-26
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - uses: ./.github/actions/setup-macos
        id: setup
        with:
          profile: release

      - name: Build AppKit release
        run: make appkit-release

      - name: Save macOS application cache
        id: save-application-cache
        if: ${{ success() && steps.setup.outputs.application-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: target/release
          key: ${{ steps.setup.outputs.application-key }}

      - name: Prune old macOS application caches
        if: github.ref == 'refs/heads/main' && steps.save-application-cache.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.setup.outputs.application-key }}
        run: |
          bash .github/scripts/prune-application-caches.sh "${CACHE_KEY}" \
            "macos-application-v2-macos-26-${{ runner.arch }}-" \
            "macos-application-prebuilt-macos-26-${{ runner.arch }}-"

      - name: Assemble application bundle
        shell: bash
        run: |
          contents="${MACOS_APP}/Contents"
          mkdir -p "${contents}/Frameworks" "${contents}/MacOS" "${contents}/Resources/licenses"
          install -m 755 target/release/shrimply "${contents}/MacOS/shrimply"
          install -m 755 target/macos-ffmpeg/install/bin/ffmpeg "${contents}/MacOS/shrimply-ffmpeg"
          install -m 644 packaging/macos/Info.plist "${contents}/Info.plist"
          install -m 644 vendor/pocketsphinx/LICENSE "${contents}/Resources/licenses/PocketSphinx-code.txt"
          install -m 644 vendor/pocketsphinx/MODEL-LICENSE "${contents}/Resources/licenses/PocketSphinx-model.txt"
          install -m 644 vendor/rhubarb-lip-sync/LICENSE "${contents}/Resources/licenses/Rhubarb-Lip-Sync.txt"
          install -m 644 vendor/vision/LICENSE "${contents}/Resources/licenses/OpenCV-Vision.txt"
          install -m 644 vendor/rubberband/COPYING "${contents}/Resources/licenses/Rubber-Band.txt"
          install -m 644 crates/math/color/src/css/LICENSE "${contents}/Resources/licenses/GTK-Pango-Color.txt"
          install -m 644 crates/math/color/src/css/NOTICE "${contents}/Resources/licenses/GTK-Pango-Color-NOTICE.txt"
          install -m 755 "$(command -v uv)" "${contents}/MacOS/uv"
          python_project="crates/media/visual/manim/manim-bridge/python"
          bundled_project="${contents}/Resources/manim-worker"
          mkdir -p "${bundled_project}"
          rsync -a --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' --exclude='uv.lock' \
            "${python_project}/" "${bundled_project}/"
          manim_revision="$(git -C external/manim rev-parse HEAD)"
          sed "s|^manimgl = .*|manimgl = { url = \"https://github.com/3b1b/manim/archive/${manim_revision}.tar.gz\" }|" \
            "${python_project}/pyproject.toml" > "${bundled_project}/pyproject.toml"
          uv lock --python 3.14 --project "${bundled_project}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "${contents}/Info.plist"

          cp target/macos-icon/Assets.car target/macos-icon/Shrimply.icns "${contents}/Resources/"

          bundle_log="${RUNNER_TEMP}/dylibbundler.log"
          if ! dylibbundler \
            --bundle-deps \
            --overwrite-dir \
            --fix-file "${contents}/MacOS/shrimply" \
            --fix-file "${contents}/MacOS/shrimply-ffmpeg" \
            --fix-file "${contents}/MacOS/uv" \
            --dest-dir "${contents}/Frameworks" \
            --install-path '@executable_path/../Frameworks/' \
            > "${bundle_log}" 2>&1; then
            tail -n 200 "${bundle_log}"
            exit 1
          fi

          find "${contents}/MacOS" "${contents}/Frameworks" -type f -print0 \
            | while IFS= read -r -d '' binary; do
                otool -l "${binary}" \
                  | awk '/cmd LC_RPATH/ { getline; getline; sub(/^[[:space:]]*path /, ""); sub(/ \(offset.*$/, ""); count[$0]++ } END { for (path in count) for (i = 1; i < count[path]; i++) print path }' \
                  | while IFS= read -r duplicate; do
                      install_name_tool -delete_rpath "${duplicate}" "${binary}" 2>> "${bundle_log}"
                    done
              done
          xattr -cr "${MACOS_APP}"
          codesign --force --deep --sign - "${MACOS_APP}"

      - name: Verify application bundle
        shell: bash
        run: |
          contents="${MACOS_APP}/Contents"
          plutil -lint "${contents}/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "${contents}/Info.plist")" = "Shrimply"
          test -s "${contents}/Resources/Assets.car"
          test -s "${contents}/Resources/Shrimply.icns"
          cmp vendor/pocketsphinx/LICENSE "${contents}/Resources/licenses/PocketSphinx-code.txt"
          cmp vendor/pocketsphinx/MODEL-LICENSE "${contents}/Resources/licenses/PocketSphinx-model.txt"
          cmp vendor/rhubarb-lip-sync/LICENSE "${contents}/Resources/licenses/Rhubarb-Lip-Sync.txt"
          cmp vendor/vision/LICENSE "${contents}/Resources/licenses/OpenCV-Vision.txt"
          cmp vendor/rubberband/COPYING "${contents}/Resources/licenses/Rubber-Band.txt"
          cmp crates/math/color/src/css/LICENSE "${contents}/Resources/licenses/GTK-Pango-Color.txt"
          cmp crates/math/color/src/css/NOTICE "${contents}/Resources/licenses/GTK-Pango-Color-NOTICE.txt"
          codesign --verify --deep --strict "${MACOS_APP}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${contents}/Info.plist")" = "shrimply"
          test "$(lipo -archs "${contents}/MacOS/shrimply")" = "arm64"
          env PATH=/usr/bin:/bin "${contents}/MacOS/shrimply" --version
          env PATH=/usr/bin:/bin "${contents}/MacOS/uv" --version
          ffmpeg_version="$(env PATH=/usr/bin:/bin "${contents}/MacOS/shrimply-ffmpeg" -version)"
          test "$(awk 'NR == 1 {print $3}' <<< "${ffmpeg_version}")" = "$(cat external/ffmpeg/RELEASE)"
          test -s "${contents}/Resources/manim-worker/pyproject.toml"
          test -s "${contents}/Resources/manim-worker/uv.lock"
          test ! -d "${contents}/Resources/manim-worker/.venv"

          dependencies="${RUNNER_TEMP}/macos-dependencies.txt"
          find "${contents}/MacOS" "${contents}/Frameworks" -type f -print0 \
            | xargs -0 otool -L > "${dependencies}"
          external_dependencies="$(awk '$1 ~ /^\// && $1 !~ /^\/System\/Library\// && $1 !~ /^\/usr\/lib\// { print $1 }' "${dependencies}")"
          if [[ -n "${external_dependencies}" ]]; then
            echo "Application bundle retains external dependencies:" >&2
            echo "${external_dependencies}" >&2
            exit 1
          fi

          if "${contents}/MacOS/shrimply" "${RUNNER_TEMP}/missing.shrimp"; then
            echo "Launcher unexpectedly accepted a missing project" >&2
            exit 1
          fi
          if "${contents}/MacOS/shrimply" first.shrimp second.shrimp; then
            echo "Editor unexpectedly accepted multiple projects" >&2
            exit 1
          fi

      - name: Exercise native windows and capture the layout
        run: |
          exe="${MACOS_APP}/Contents/MacOS/shrimply"
          "$exe" project create --project "$RUNNER_TEMP/Layout.shrimp" --name "Layout fixture" \
            | jq -e '.success and .result.created'
          mkdir -p "$RUNNER_TEMP/layout"
          export SHRIMPLY_CAPTURE_WINDOWS="$RUNNER_TEMP/layout"
          python3 -c 'import subprocess, sys; subprocess.run(sys.argv[1:], check=True, timeout=30)' "$exe"
          for window in launcher appearance servers about; do
            sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/layout/$window.png"
          done

      - uses: actions/upload-artifact@v7
        name: Upload the window captures
        if: always()
        with:
          name: macos-native-windows
          path: ${{ runner.temp }}/layout

      - name: Create and verify archive
        run: |
          archive_name="$(basename "${MACOS_ARCHIVE}")"
          ditto -c -k --sequesterRsrc --keepParent "${MACOS_APP}" "${MACOS_ARCHIVE}"
          (
            cd "$(dirname "${MACOS_ARCHIVE}")"
            shasum -a 256 "${archive_name}" > "${archive_name}.sha256"
            shasum -a 256 --check "${archive_name}.sha256"
          )

          unpacked="${RUNNER_TEMP}/shrimply-macos-verify"
          mkdir -p "${unpacked}"
          ditto -x -k "${MACOS_ARCHIVE}" "${unpacked}"
          codesign --verify --deep --strict --verbose=2 "${unpacked}/Shrimply.app"
          test -s "${MACOS_ARCHIVE}.sha256"

      - name: Upload signed application ZIP
        uses: actions/upload-artifact@v7
        with:
          name: shrimply-macos-arm64
          path: ${{ env.MACOS_ARCHIVE }}
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    uses: ./.github/workflows/publish-zip.yml
    permissions:
      contents: write
    with:
      artifact: shrimply-macos-arm64
