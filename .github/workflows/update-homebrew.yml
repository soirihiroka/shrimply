name: Update Homebrew tap

on:
  workflow_run:
    workflows: [macOS prerelease]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-homebrew-tap

env:
  TZ: UTC

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: soirihiroka/homebrew-tap/.github/workflows/update.yml@main
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
