name: Project server Docker

on:
  push:
    branches: [main]
    paths: &inputs
      - ".github/workflows/project-server.yml"
      - ".dockerignore"
      - "crates/integrations/project-protocol/**"
      - "crates/integrations/project-server/**"
      - "crates/resource-pipeline/**"
      - "packaging/project-server-smoke.py"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile.project-server"
      - "Makefile"
      - "rust-toolchain.toml"
  pull_request:
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-server-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build project server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.project-server
          load: true
          tags: shrimply-project-server:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=project-server
          cache-to: type=gha,scope=project-server,mode=max

      - name: Verify version, sign-in, and two-client sync
        env:
          SHRIMPLY_PROJECT_SERVER_USERNAME: editor
          SHRIMPLY_PROJECT_SERVER_PASSWORD: ci-smoke-test
        run: |
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$(docker run --rm shrimply-project-server:ci --version)" = "shrimply-project-server ${expected}"
          port=8788
          docker run --detach --name project-server-smoke --hostname project-server-smoke \
            --env SHRIMPLY_PROJECT_SERVER_USERNAME --env SHRIMPLY_PROJECT_SERVER_PASSWORD \
            --publish "127.0.0.1::${port}/tcp" \
            shrimply-project-server:ci
          trap 'docker logs project-server-smoke; docker rm --force project-server-smoke' EXIT
          endpoint="http://$(docker port project-server-smoke "${port}/tcp")/v1"
          curl --fail --silent --show-error --max-time 3 --retry 20 --retry-connrefused --retry-delay 1 \
            "${endpoint}" \
            | python3 -c 'import json, sys; info = json.load(sys.stdin); assert info["protocol"] == 3 and info["version"] == sys.argv[1] and info["name"] == "project-server-smoke"' "${expected}"
          python3 packaging/project-server-smoke.py "${endpoint}"

      - name: Export prerelease image
        run: |
          image="shrimply-project-server:prerelease"
          timestamped="${image}-$(date -u +%Y%m%dT%H%M%SZ)"
          docker tag shrimply-project-server:ci "$image"
          docker tag shrimply-project-server:ci "$timestamped"
          docker save "$image" "$timestamped" \
            | gzip > shrimply-project-server.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: shrimply-project-server-image
          path: shrimply-project-server.tar.gz
          if-no-files-found: error
          compression-level: 0
