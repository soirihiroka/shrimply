services:
  server:
    image: ghcr.io/soirihiroka/shrimply-server:${SHRIMPLY_SERVER_TAG:-prerelease-cuda12.6}
    gpus: all
    network_mode: host
    volumes:
      - ./.docker/huggingface:/root/.cache/huggingface
      - ./.docker/pneuma/models:/app/models
    healthcheck:
      test: curl -fso /dev/null http://localhost:8787/
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5m
