[package]
name = "sanim-presenter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sanim-core.workspace = true
sanim-lang = { workspace = true, features = ["native-text", "media"] }
sanim-render.workspace = true
shrimply-math-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
