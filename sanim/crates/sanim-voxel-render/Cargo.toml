[package]
name = "sanim-voxel-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sanim-voxel.workspace = true
shrimply-math-color.workspace = true
wgpu.workspace = true
pollster.workspace = true
serde.workspace = true
fraction.workspace = true
num-traits.workspace = true
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

