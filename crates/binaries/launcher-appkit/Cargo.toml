[package]
name = "shrimply-launcher-appkit"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shrimply-appkit"
path = "src/main.rs"

[dependencies]
shrimply-cross-ui-core = { workspace = true }
shrimply-components-core = { workspace = true }
shrimply-math-core = { workspace = true }
shrimply-project-types = { workspace = true }
shrimply-process-reporting = { workspace = true }
shrimply-recent-projects = { workspace = true }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
shrimply-editor-appkit = { path = "../editor-appkit" }
