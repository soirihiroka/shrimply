[package]
name = "shrimply-editor-gtk"
version = "0.1.0"
edition = "2024"
default-run = "shrimply-editor"

[[bin]]
name = "shrimply-editor"
path = "src/main.rs"

[dependencies]
shrimply-trust-core.workspace = true
glib = { workspace = true, features = ["log"] }
adw.workspace = true
async-channel.workspace = true
ffmpeg-next.workspace = true
gdk-pixbuf.workspace = true
gtk.workspace = true
libc.workspace = true
num-traits.workspace = true
pango = { workspace = true, features = ["v1_56"] }
serde_json.workspace = true
shrimply-audio-engine = { workspace = true }
shrimply-blender-core = { workspace = true }
shrimply-asset = { workspace = true }
shrimply-cross-ui-core = { workspace = true }
shrimply-components-core = { workspace = true }
shrimply-cross-ui-theme = { workspace = true }
shrimply-export-gtk = { workspace = true }
shrimply-inspector-gtk = { workspace = true }
shrimply-math-core = { workspace = true }
shrimply-manim-bridge = { workspace = true }
shrimply-mcp = { workspace = true, default-features = false }
shrimply-otio-parser = { workspace = true }
shrimply-kdenlive-parser = { workspace = true }
shrimply-preview-gtk = { workspace = true }
shrimply-playback-performance = { workspace = true }
shrimply-preferences-core = { workspace = true }
shrimply-preferences-gtk = { workspace = true }
shrimply-property-transfer = { workspace = true }
shrimply-project-document = { workspace = true, default-features = true }
shrimply-compute-client = { workspace = true }
shrimply-editor-state = { workspace = true }
shrimply-process-reporting = { workspace = true }
shrimply-recent-projects = { workspace = true }
shrimply-timeline-edit = { workspace = true }
shrimply-timeline-gtk = { workspace = true }
shrimply-transcription = { workspace = true }
shrimply-tts = { workspace = true }
shrimply-components-gtk = { workspace = true }
shrimply-visual-cuda = { workspace = true }
shrimply-visual-modifiers = { workspace = true }
tracing.workspace = true
uuid.workspace = true
