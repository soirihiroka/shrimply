[package]
name = "shrimply-preferences-core"
version = "0.1.0"
edition = "2024"

[dependencies]
libc.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
shrimply-blender-core = { workspace = true }
shrimply-math-color = { workspace = true }
shrimply-math-core = { workspace = true }
shrimply-project-document = { workspace = true, default-features = true }
shrimply-recent-projects = { workspace = true }
shrimply-compute-client = { workspace = true }
shrimply-i18n = { workspace = true }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_SystemInformation"] }
