[package]
name = "shrimply-editing-api"
version = "0.1.0"
edition = "2024"

[dependencies]
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shrimply-property-model = { workspace = true }
shrimply-math-core = { workspace = true }
shrimply-media-info = { workspace = true }
shrimply-media-import.workspace = true
shrimply-asset.workspace = true
shrimply-tts.workspace = true
shrimply-project-document = { workspace = true, default-features = true }
shrimply-timeline-edit = { workspace = true }
shrimply-visual-modifiers = { workspace = true, default-features = true }
uuid = { workspace = true, features = ["serde"] }
shrimply-local-ipc.workspace = true
shrimply-path-core.workspace = true
sha2.workspace = true
regex.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }
