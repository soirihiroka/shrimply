[project]
name = "shrimply-manim-parser-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["cyclopts>=5.3", "manimgl", "msgpack", "pywavefront", "trimesh>=5.1.1"]

[tool.uv]
package = false
default-groups = ["dev", "pyav"]

[tool.uv.sources]
av = { url = "https://files.pythonhosted.org/packages/source/a/av/av-19.0.2.tar.gz" }
manimgl = { path = "../../../../../../external/manim", editable = true }

[dependency-groups]
# ManimGL imports VideoMobject eagerly but omits its PyAV dependency from install_requires.
pyav = ["av>=19.0.2"]
dev = [
    "pyrefly==1.4.0",
]
