[package]
name = "shrimply-text-3d"
version = "0.1.0"
edition = "2024"

[dependencies]
shrimply-fonts = { workspace = true, features = ["native"] }
hashbrown.workspace = true
cairo = { workspace = true, features = ["freetype"] }
glam.workspace = true
glib.workspace = true
lyon_tessellation.workspace = true
pango = { workspace = true, features = ["v1_56"] }
pangocairo.workspace = true
serde = { workspace = true, features = ["derive"] }
shrimply-property-model = { workspace = true }
shrimply-scene-3d = { workspace = true }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
