[package]
name = "shrimply-visual-frame"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["dep:shrimply-gpu-cuda", "dep:shrimply-gpu-cuda-memory"]

[dependencies]
shrimply-gpu-cuda = { workspace = true, optional = true }
shrimply-gpu-cuda-memory = { workspace = true, optional = true }
ffmpeg-next.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9.0", default-features = false, features = ["media", "api-level-26"] }
