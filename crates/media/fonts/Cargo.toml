[package]
name = "shrimply-fonts"
version = "0.1.0"
edition = "2024"

[features]
native = ["dep:pango", "dep:pangocairo", "dep:cairo", "dep:skia-safe", "dep:tempfile"]

[dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
pango = { workspace = true, optional = true, features = ["v1_57"] }
pangocairo = { workspace = true, optional = true }
cairo = { workspace = true, optional = true }
skia-safe = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
