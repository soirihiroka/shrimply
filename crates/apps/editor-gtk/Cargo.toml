[package]
name = "shrimply-editor-gtk"
version = "0.1.0"
edition = "2024"
default-run = "shrimply-editor"

[[bin]]
name = "shrimply-editor"
path = "src/main.rs"

[dependencies]
adw.workspace = true
async-channel.workspace = true
ffmpeg-next.workspace = true
gdk-pixbuf.workspace = true
gtk.workspace = true
libc.workspace = true
num-traits.workspace = true
pango = { workspace = true, features = ["v1_56"] }
serde_json.workspace = true
shrimply-audio = { path = "../../audio/audio" }
shrimply-blender = { path = "../../blender/blender-bridge" }
shrimply-asset = { path = "../../asset" }
shrimply-cross-ui-core = { path = "../../ui/cross-ui-core" }
shrimply-component-core = { path = "../../ui/component-core" }
shrimply-cross-ui-theme = { path = "../../ui/cross-ui-theme" }
shrimply-export-gtk = { path = "../../export/export-gtk" }
shrimply-inspector-gtk = { path = "../../ui/inspector-gtk" }
shrimply-math-core = { path = "../../math/core" }
shrimply-manim-parser = { path = "../../manim/manim-parser" }
shrimply-mcp = { path = "../../mcp", default-features = false }
shrimply-otio = { path = "../../project/otio" }
shrimply-kdenlive = { path = "../../project/kdenlive" }
shrimply-preview-gtk = { path = "../../preview/preview-gtk" }
shrimply-playback-performance = { path = "../../preview/playback-performance" }
shrimply-preferences-core = { path = "../../preferences/preferences-core" }
shrimply-preferences-gtk = { path = "../../preferences/preferences-gtk" }
shrimply-property-transfer = { path = "../../property-transfer" }
shrimply-project = { path = "../../project/project" }
shrimply-server-client = { path = "../../server-client" }
shrimply-state = { path = "../../state" }
shrimply-support = { path = "../../support" }
shrimply-timeline = { path = "../../timeline/timeline" }
shrimply-timeline-ui = { path = "../../timeline/timeline-ui" }
shrimply-transcription = { path = "../../audio/transcription" }
shrimply-tts = { path = "../../audio/tts" }
shrimply-gtk-components = { path = "../../ui/gtk-components" }
shrimply-video = { path = "../../video/rendering" }
shrimply-video-modifiers = { path = "../../video/video-modifiers" }
tracing.workspace = true
uuid.workspace = true
