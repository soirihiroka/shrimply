[package]
name = "shrimply-export-cuda"
version = "0.1.0"
edition = "2024"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ffmpeg-next.workspace = true
shrimply-export-core = { workspace = true, default-features = true }
shrimply-math-core = { workspace = true }
shrimply-project-document = { workspace = true, default-features = true }
shrimply-visual-cuda = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
shrimply-preview-render-core.workspace = true
shrimply-preview-render-vulkan.workspace = true
shrimply-render-core.workspace = true
shrimply-render-vulkan.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
skia-safe.workspace = true
shrimply-visual-modifiers.workspace = true
shrimply-scene-3d.workspace = true
serde_json.workspace = true
uuid.workspace = true
