[package]
name = "shrimply-export-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ffmpeg-next.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shrimply-audio-engine = { workspace = true }
shrimply-math-color = { workspace = true, features = ["gif"] }
shrimply-math-core = { workspace = true }
shrimply-math-media = { workspace = true }
shrimply-project-document = { workspace = true, default-features = true }
shrimply-visual-core = { workspace = true }
tempfile.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
shrimply-preview-render-vulkan.workspace = true
shrimply-render-vulkan = { workspace = true, features = ["android-media"] }
ndk = { version = "0.9.0", default-features = false }
skia-safe.workspace = true

[dev-dependencies]
fastrand = "2"
hound = "3"
